[workspace]
resolver = "2"
members = [
    "crates/haider-protocol",
    "crates/haider-store",
    "crates/haider-core",
    "crates/haider-daemon",
    "crates/haider-daemond",
    "crates/haider-provider",
    "crates/haider-tools",
    "crates/haider-verify",
    "crates/haider-accounts",
    "crates/haider-rpc",
    "crates/haider-client",
    "crates/haider-stt",
    "crates/haider-tui",
    "crates/haider-cli",
    "xtask",
]

[workspace.package]
version = "0.0.78"
edition = "2024"
license = "LicenseRef-Proprietary-Undecided"
repository = "https://github.com/Rizzist/haider-agent"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
cpal = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
bytes = "1"
getrandom = "0.3"
httpdate = "1"
jsonwebtoken = "9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
termbg = "0.6"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "test-util", "net", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
