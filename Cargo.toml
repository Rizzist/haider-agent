[workspace]
resolver = "2"
members = [
    "crates/haider-protocol",
    "crates/haider-store",
    "crates/haider-core",
    "crates/haider-provider",
    "crates/haider-tools",
    "crates/haider-verify",
    "crates/haider-accounts",
    "crates/haider-rpc",
    "crates/haider-tui",
    "crates/haider-cli",
    "xtask",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "LicenseRef-Proprietary-Undecided"
repository = "https://github.com/Rizzist/haider-agent"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
termbg = "0.6"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
