name: android-daemon

# Native compile/test only. android-apk is the atomic phone-release authority.
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'scripts/android/**', '.github/workflows/android-daemon.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'scripts/android/**', '.github/workflows/android-daemon.yml']
  workflow_dispatch:
    inputs:
      legacy_termux:
        description: 'Also build explicitly legacy developer Termux executables'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: install pinned Android native tooling
        run: |
          sdkmanager 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: host Android policy, vault, lifecycle and RPC tests
        run: cargo test --locked -p haider-android -p haider-daemon -p haider-accounts -p haider-platform -p haider-rpc
      - name: compile and verify both native libraries
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 scripts/android/build-native.py --output native-build --version "$VERSION"
      - name: archive native compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-native-compile
          path: native-build/jniLibs/**
          if-no-files-found: error
      - name: archive native symbols separately
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-native-symbols
          path: native-build/symbols/**
          if-no-files-found: error
      - name: build optional legacy Termux developer executables
        if: inputs.legacy_termux == true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: cargo ndk -t arm64-v8a -P 26 build --release --locked -p haider-cli -p haider-daemond -p haider-tui-exe
      - name: archive legacy Termux executables (not the standalone phone deliverable)
        if: inputs.legacy_termux == true
        uses: actions/upload-artifact@v4
        with:
          name: legacy-termux-developer-executables-arm64
          path: |
            target/aarch64-linux-android/release/haider
            target/aarch64-linux-android/release/haiderd
            target/aarch64-linux-android/release/haider-tui
          if-no-files-found: error
