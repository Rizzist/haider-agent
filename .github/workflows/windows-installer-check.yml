# Permanent native Windows installer rehearsal. Advisory to the release
# decision under registry #80 until its first green; publishes no release.
# Build and Additional installers mirror release.yml; only matrix, source-run
# plumbing and refs/tags checks differ. No manual release.yml dispatch needed.
name: windows-installer-check
on:
  push:
    branches: [ci-winonly-*]
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Prior run with an unexpired Windows distribution for this exact SHA (empty builds it)
        required: false
        default: ''
        type: string

concurrency:
  group: windows-installer-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: inputs.reuse_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: tag matches workspace version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      # Defender scans every intermediate artifact cargo writes -- every .rlib,
      # every object file -- which is the single largest tax on the Windows
      # runner. Combined with lto="fat" + codegen-units=1 it made the Windows
      # leg a ~2h long pole while every other platform finished in a fraction of
      # that. Excluding the build tree and the toolchain processes is the
      # cheapest available win. Best-effort: never fail a release over it.
      - name: exclude the build tree from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}\target" -ErrorAction Stop
            foreach ($p in @('rustc.exe','cargo.exe','link.exe','lld-link.exe')) {
              Add-MpPreference -ExclusionProcess $p -ErrorAction Stop
            }
            Write-Host "Defender exclusions applied for the build tree and toolchain."
          } catch {
            Write-Warning "Could not apply Defender exclusions: $_. Build continues, just slower."
          }
      - name: build
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p haider-cli -p haider-tui-exe -p haider-daemond --target ${{ matrix.target }}
      # WINDOWS ONLY: thin LTO across 16 codegen units instead of fat LTO in one.
      #
      # v0.0.965 added russh for cross-platform SSH, which pulls 76 crates of
      # crypto -- fiat-crypto, curve25519-dalek, elliptic-curve, crypto-bigint,
      # ml-kem, p256, ed25519-dalek. That code is heavily generic and heavily
      # inlined, so it produces an enormous amount of LLVM IR. Under
      # lto="fat" + codegen-units=1 all of it is optimised as ONE
      # single-threaded unit, and the cost is superlinear in IR size: the
      # Windows leg went from 33 minutes on v0.0.964 to over 3.5 hours on
      # v0.0.965 while every other platform stayed fast. MSVC compounds it by
      # writing the PDB single-threaded from the same link.
      #
      # Thin LTO is parallel and incremental across codegen units and recovers
      # most of fat LTO's runtime benefit for a fraction of the link cost. The
      # trade is a marginally less optimised Windows binary, which is plainly
      # worth it against a multi-hour link that risks the 6h job ceiling.
      #
      # Set via CARGO_PROFILE_RELEASE_* rather than Cargo.toml so EVERY other
      # platform keeps fat LTO byte-for-byte unchanged.
      #
      # MEASURED on the v0.0.965 re-tag: 28m42s, i.e. faster than v0.0.964's
      # 33 minutes despite 86 more crates. Record the number each release
      # rather than trusting this comment.
      - name: build (Windows, thin LTO)
        if: runner.os == 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p haider-cli -p haider-tui-exe -p haider-daemond --target ${{ matrix.target }}
      - name: build Wayland portal companion (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p haider-tools --bin haider-wayland-portal --target ${{ matrix.target }}
      - name: Developer ID sign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERT_PASSWORD:-}" ]; then
            echo "SKIP: macOS binary signing; Developer ID secrets are absent"
            exit 0
          fi

          P12="$RUNNER_TEMP/haider-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/haider-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r listed_keychain; do
            [ -n "$listed_keychain" ] && ORIGINAL_KEYCHAINS+=("$listed_keychain")
          done < <(security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')

          cleanup_signing_keychain() {
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12"
          }
          trap cleanup_signing_keychain EXIT

          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS[@]}"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "Recovered certificate does not contain a Developer ID Application identity" >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haider \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haider
          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haiderd \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haiderd

          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --identifier ai.haidercode.haider-tui \
            target/${{ matrix.target }}/release/haider-tui
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider-tui
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haiderd

          # Installed <=969 updaters accept exactly haider + haiderd. Embed the
          # already signed split executables as data, then sign this legacy
          # entry point. Its staging probes are read-only; first normal use
          # publishes the embedded bundle through the same durable transaction.
          HAIDER_THIN_EXE="$PWD/target/${{ matrix.target }}/release/haider" \
          HAIDER_TUI_EXE="$PWD/target/${{ matrix.target }}/release/haider-tui" \
            cargo build --release --locked -p haider-compat \
              --features embedded-bundle --target ${{ matrix.target }}
          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haider.compat \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haider-compat
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider-compat
          target/${{ matrix.target }}/release/haider-compat self-test | grep '"ok":true'
      - name: smoke (binary runs + self-test; strict version match on tag builds)
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          TBIN=target/${{ matrix.target }}/release/haider-tui$EXE
          "$TBIN" --version
          "$BIN" self-test | grep '"ok":true'
          if [ "$RUNNER_OS" != "Windows" ]; then file "$BIN"; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$("$BIN" --version)" = "haider $TAG"
            test "$("$TBIN" --version)" = "haider-tui $TAG"
          else
            "$BIN" --version
          fi
      # THE GATE THAT WOULD HAVE CAUGHT THE 0.0.964 WINDOWS P0.
      #
      # `self-test` and `--version` never reach profile resolution, so for the
      # entire life of the project the release gate could not see that
      # ProfileEnv::capture() read only HOME -- which is not a Windows
      # environment variable. Every Windows user got exit 70 before anything
      # happened; on Explorer the console vanished with the message inside it.
      #
      # `--ready` is the scriptable front door: it resolves the profile,
      # connect-or-spawns the daemon, reports, and exits. It is the shallowest
      # command that exercises the real startup path.
      #
      # HAIDER_PROFILE_DIR is deliberately NOT set here. Setting it is exactly
      # what blinded every existing Windows integration test: it short-circuits
      # the resolver under test. HOME is scrubbed for the same reason -- the
      # xplat suite runs under Git Bash, which exports HOME, so a stock-Windows
      # bug survives a green Windows CI run. This asserts what a real user has:
      # USERPROFILE and no HOME.
      - name: front door resolves a profile from a stock environment
        shell: bash
        run: |
          set -euo pipefail
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN="$PWD/target/${{ matrix.target }}/release/haider$EXE"
          OUT="$RUNNER_TEMP/front-door.txt"

          if [ "$RUNNER_OS" = "Windows" ]; then
            # Reproduce Explorer/PowerShell: USERPROFILE present, HOME absent.
            env -u HOME -u HAIDER_PROFILE_DIR "$BIN" --ready > "$OUT" 2>&1 && rc=0 || rc=$?
          else
            env -u HAIDER_PROFILE_DIR "$BIN" --ready > "$OUT" 2>&1 && rc=0 || rc=$?
          fi

          cat "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the front door failed with exit $rc from a stock environment" >&2
            exit 1
          fi
          # Belt and braces: even a zero exit must not carry the resolver error.
          if grep -qi "cannot resolve a profile directory" "$OUT"; then
            echo "::error::profile resolution failed -- this is the 0.0.964 Windows P0 class" >&2
            exit 1
          fi
      - name: notarize macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID MACOS_SIGNING_CERT_P12_BASE64 MACOS_SIGNING_CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "SKIP: macOS binary notarization; secret $name is absent"
              exit 0
            fi
          done

          PAYLOAD="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}"
          ARCHIVE="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}.zip"
          RESULT="$RUNNER_TEMP/haider-notarization-result.json"
          mkdir -p "$PAYLOAD"
          cp target/${{ matrix.target }}/release/haider "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haider-tui "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haider-compat "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haiderd "$PAYLOAD/"
          ditto -c -k --keepParent "$PAYLOAD" "$ARCHIVE"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m --output-format json > "$RESULT"

          jq '{id, status, message}' "$RESULT"
          STATUS="$(jq -r '.status // empty' "$RESULT")"
          SUBMISSION_ID="$(jq -r '.id // empty' "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"
            fi
            echo "Apple notarization failed with status: ${STATUS:-unknown}" >&2
            exit 1
          fi

          # stapler cannot attach tickets to raw Mach-O files or ZIP archives.
          # Apple publishes the nested-binary tickets for Gatekeeper to resolve
          # online; the exact signed bytes are packaged below without mutation.
      - name: archive daemon symbols by native build ID
        shell: bash
        run: |
          set -euo pipefail

          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          RELEASE_DIR=target/${{ matrix.target }}/release
          DBIN="$RELEASE_DIR/haiderd$EXE"
          ARCHIVER="$RELEASE_DIR/haider-symbol-archive$EXE"
          case "$RUNNER_OS" in
            macOS) SYMBOLS="$RELEASE_DIR/haiderd.dSYM" ;;
            Linux) SYMBOLS="$RELEASE_DIR/haiderd.dwp" ;;
            Windows) SYMBOLS="$RELEASE_DIR/haiderd.pdb" ;;
            *) echo "Unsupported symbol platform: $RUNNER_OS" >&2; exit 1 ;;
          esac

          "$ARCHIVER" "$DBIN" "$SYMBOLS" "symbols/${{ matrix.target }}"
          du -sh "symbols/${{ matrix.target }}"
      - name: package
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          TBIN=target/${{ matrix.target }}/release/haider-tui$EXE
          DBIN=target/${{ matrix.target }}/release/haiderd$EXE
          WBIN=target/${{ matrix.target }}/release/haider-wayland-portal
          REF="${GITHUB_REF_NAME:-manual}"
          NAME=haider-${REF}-${{ matrix.target }}-split
          mkdir -p dist/$NAME
          # All runtime siblings belong to the same versioned split bundle.
          cp "$BIN" "$TBIN" "$DBIN" dist/$NAME/
          if [ "$RUNNER_OS" = "Linux" ]; then cp "$WBIN" dist/$NAME/; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # haider.exe is a CONSOLE binary. Double-clicked from Explorer,
            # Windows destroys the console the instant the process exits and
            # takes any error with it -- the reported "blank window for a
            # second, then disappears". Ship a launcher that holds the window
            # open on a non-zero exit, and a README covering the SmartScreen
            # prompt that an unsigned binary necessarily produces.
            # printf, not a heredoc: a heredoc terminator must sit at column 0
            # and would break this YAML block scalar.
            printf '%s\r\n' \
              '@echo off' \
              'cd /d "%~dp0"' \
              'haider.exe %*' \
              'set HAIDER_EXIT=%ERRORLEVEL%' \
              'if not "%HAIDER_EXIT%"=="0" (' \
              '  echo.' \
              '  echo haider exited with code %HAIDER_EXIT%.' \
              '  echo The message above is the reason.' \
              '  echo Report it at https://github.com/Rizzist/haider-agent/issues' \
              '  echo.' \
              '  pause' \
              ')' \
              'exit /b %HAIDER_EXIT%' > "dist/$NAME/haider.cmd"
            printf '%s\r\n' \
              'Haider for Windows' \
              '==================' \
              '' \
              'RUN IT' \
              '  Double-click haider.cmd  (not haider.exe -- see below)' \
              '' \
              '  Or from a terminal, which is better because you keep the output:' \
              '      cd path\to\this\folder' \
              '      haider.exe' \
              '' \
              '  haider.exe is a console program. Double-clicked from Explorer,' \
              '  Windows closes the window the moment it exits, so you never get' \
              '  to read an error. haider.cmd keeps the window open on failure.' \
              '' \
              '"WINDOWS PROTECTED YOUR PC"' \
              '  These binaries are not yet code-signed, so SmartScreen warns and' \
              '  Defender may quarantine them. That warning is about the ABSENCE' \
              '  of a signature, not about detected malicious behaviour.' \
              '  To run anyway: click "More info", then "Run anyway".' \
              '' \
              '  Verify what you downloaded -- the release page publishes a' \
              '  SHA-256 next to the zip:' \
              '      certutil -hashfile <the-zip-you-downloaded> SHA256' \
              '' \
              'KEEP ALL THREE FILES TOGETHER' \
              '  haider.exe starts haider-tui.exe and haiderd.exe from its folder.' \
              '  Moving any sibling breaks it. To put haider on PATH, add this' \
              '  whole folder rather than copying haider.exe elsewhere.' \
              '' \
              'Source, releases and issues:' \
              '  https://github.com/Rizzist/haider-agent' > "dist/$NAME/README.txt"
            # Zip is the native Windows archive expectation; Explorer opens it
            # without extra tooling and sha256sum ships with Git Bash.
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          else
            tar -C dist -cJf dist/$NAME.tar.xz $NAME
            (cd dist && shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256")
          fi
      - name: verify complete split archive and checksum
        shell: bash
        run: |
          EXT=tar.xz; [ "$RUNNER_OS" = "Windows" ] && EXT=zip
          NAME=haider-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}-split
          python scripts/release_packaging.py verify-bundle --artifact "dist/$NAME.$EXT" --target "${{ matrix.target }}"
      - name: package compatibility assets for installed two-member macOS updaters
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          NAME=haider-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/haider-compat "dist/$NAME/haider"
          cp target/${{ matrix.target }}/release/haiderd "dist/$NAME/haiderd"
          tar -C dist -cJf "dist/$NAME.tar.xz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256")
          python3 scripts/release_packaging.py verify-legacy-bundle \
            --artifact "dist/$NAME.tar.xz" --target ${{ matrix.target }}
      - name: upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: |
            dist/*.tar.*
            dist/*.zip*
          if-no-files-found: error
      # Current arm64 macOS line-table symbols are 191 MiB raw / 43.7 MiB
      # gzip-compressed. Keep this private CI artifact long enough for recent
      # crash triage without paying unbounded storage on every release.
      - name: upload native-ID-keyed daemon symbols (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.target }}
          path: symbols/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  installers:
    name: Additional installers (${{ matrix.target }})
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_run_id != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: require exact-SHA artifact provenance when reusing a run
        if: inputs.reuse_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          python scripts/release/find-evidence.py release.yml "$GITHUB_SHA" \
            --artifact distribution-x86_64-pc-windows-msvc --artifact-run-id "$REUSE_RUN_ID" > artifact-source.txt
          grep -q '^artifact_run_id=[1-9][0-9]*$' artifact-source.txt
      - uses: actions/download-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: archives
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Freeze exact archive members and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "INSTALLER_VERSION=$VERSION" >> "$GITHUB_ENV"
          python scripts/installer_payload.py --archives archives --output payload \
            --version "$VERSION" --target '${{ matrix.target }}'
          EXE=""; [ "$RUNNER_OS" != Windows ] || EXE=.exe
          test "$(payload/haider$EXE --version)" = "haider $VERSION"
      - name: Packaging regression tests
        shell: bash
        env:
          # test_install_bundle_native needs the native release siblings; `payload` holds the
          # frozen archive members for this runner's own target (xplat uses target/debug).
          HAIDER_INSTALL_TEST_BIN_DIR: payload
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install native Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm cpio libasound2t64 libglib2.0-0t64
      - name: Build and inspect deb/rpm
        if: runner.os == 'Linux'
        run: |
          python3 packaging/installers/linux-build.py --payload payload --output installers \
            --version "$INSTALLER_VERSION" --target '${{ matrix.target }}'
      - name: Linux T1 install upgrade remove purge in containers
        if: runner.os == 'Linux'
        run: bash scripts/qa-gate/installers-linux.sh payload installers "$INSTALLER_VERSION" '${{ matrix.target }}'
      - name: Build inspect sign notarize macOS pkg and dmg
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/installers/macos-build.sh payload installers "$INSTALLER_VERSION" '${{ matrix.target }}'
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build sign and inspect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./packaging/installers/windows-build.ps1 -Payload payload -Manifest payload/manifest.json `
            -Version $env:INSTALLER_VERSION -Target '${{ matrix.target }}' -Output installers
      - name: Publish tarball uninstaller as additional asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="haider-v${INSTALLER_VERSION}-${{ matrix.target }}-uninstall-haider.sh"
          cp payload/uninstall-haider.sh "installers/$NAME"
          (cd installers && shasum -a 256 "$NAME" > "$NAME.sha256")
      - name: Upload verified additional assets
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            installers/*.exe
            installers/*.pkg
            installers/*.dmg
