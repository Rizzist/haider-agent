# Pre-tag Windows-only replica of release.yml's build + Additional installers jobs (no ship-gate,
# no publish). Dispatch on a side branch to prove the Windows installer lifecycle before tagging.
# Generated 2026-09-07 from release.yml at 98e219c7; build/installer steps are verbatim.
name: windows-installer-check
'on':
  push:
    branches: ['ci-winonly-*']
  workflow_dispatch: {}
concurrency:
  group: windows-installer-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: unsafe-count gate
      shell: bash
      run: bash scripts/check-unsafe-counts.sh
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        targets: ${{ matrix.target }}
    - name: install Linux system deps
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
    - name: tag matches workspace version (tag builds only)
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: 'TAG="${GITHUB_REF_NAME#v}"

        grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }

        '
    - name: exclude the build tree from Defender (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      run: "try {\n  Add-MpPreference -ExclusionPath \"${{ github.workspace }}\\target\" -ErrorAction Stop\n  foreach ($p in @('rustc.exe','cargo.exe','link.exe','lld-link.exe')) {\n    Add-MpPreference -ExclusionProcess $p -ErrorAction Stop\n  }\n  Write-Host \"Defender exclusions applied for the build tree and toolchain.\"\n} catch {\n  Write-Warning \"Could not apply Defender exclusions: $_. Build continues, just slower.\"\n}\n"
    - name: build
      if: runner.os != 'Windows'
      run: cargo build --release --locked -p haider-cli -p haider-tui-exe -p haider-daemond --target ${{ matrix.target }}
    - name: build (Windows, thin LTO)
      if: runner.os == 'Windows'
      env:
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      run: cargo build --release --locked -p haider-cli -p haider-tui-exe -p haider-daemond --target ${{ matrix.target }}
    - name: build Wayland portal companion (Linux only)
      if: runner.os == 'Linux'
      run: cargo build --release --locked -p haider-tools --bin haider-wayland-portal --target ${{ matrix.target }}
    - name: Developer ID sign macOS binaries
      if: runner.os == 'macOS'
      shell: bash
      env:
        MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      run: "set -euo pipefail\n\nif [ -z \"${MACOS_SIGNING_CERT_P12_BASE64:-}\" ] || [ -z \"${MACOS_SIGNING_CERT_PASSWORD:-}\" ]; then\n  echo \"SKIP: macOS binary signing; Developer ID secrets are absent\"\n  exit 0\nfi\n\nP12=\"$RUNNER_TEMP/haider-developer-id.p12\"\nKEYCHAIN=\"$RUNNER_TEMP/haider-signing.keychain-db\"\nKEYCHAIN_PASSWORD=\"$(openssl rand -base64 32)\"\nORIGINAL_KEYCHAINS=()\nwhile IFS= read -r listed_keychain; do\n  [ -n \"$listed_keychain\" ] && ORIGINAL_KEYCHAINS+=(\"$listed_keychain\")\ndone < <(security list-keychains -d user \\\n  | sed -E 's/^[[:space:]]*\"//; s/\"[[:space:]]*$//')\n\ncleanup_signing_keychain() {\n  security list-keychains -d user -s \"${ORIGINAL_KEYCHAINS[@]}\" >/dev/null 2>&1 || true\n  security delete-keychain \"$KEYCHAIN\" >/dev/null 2>&1 || true\n  rm -f \"$P12\"\n}\ntrap cleanup_signing_keychain EXIT\n\nprintf '%s' \"$MACOS_SIGNING_CERT_P12_BASE64\" | base64 -D > \"$P12\"\nsecurity create-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN\"\nsecurity\
        \ set-keychain-settings -lut 21600 \"$KEYCHAIN\"\nsecurity unlock-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN\"\nsecurity import \"$P12\" -k \"$KEYCHAIN\" -P \"$MACOS_SIGNING_CERT_PASSWORD\" \\\n  -T /usr/bin/codesign -T /usr/bin/security\nsecurity set-key-partition-list -S apple-tool:,apple:,codesign: \\\n  -s -k \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN\"\nsecurity list-keychains -d user -s \"$KEYCHAIN\" \"${ORIGINAL_KEYCHAINS[@]}\"\n\nIDENTITY=\"$(security find-identity -v -p codesigning \"$KEYCHAIN\" \\\n  | sed -n 's/.*\"\\(Developer ID Application: [^\"]*\\)\".*/\\1/p' \\\n  | head -1)\"\nif [ -z \"$IDENTITY\" ]; then\n  echo \"Recovered certificate does not contain a Developer ID Application identity\" >&2\n  exit 1\nfi\n\ncodesign --force --options runtime --timestamp \\\n  --identifier ai.haidercode.haider \\\n  --sign \"$IDENTITY\" \\\n  target/${{ matrix.target }}/release/haider\ncodesign --force --options runtime --timestamp \\\n  --identifier ai.haidercode.haiderd \\\n \
        \ --sign \"$IDENTITY\" \\\n  target/${{ matrix.target }}/release/haiderd\n\ncodesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider\ncodesign --force --options runtime --timestamp \\\n  --sign \"$IDENTITY\" \\\n  --identifier ai.haidercode.haider-tui \\\n  target/${{ matrix.target }}/release/haider-tui\ncodesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider-tui\ncodesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haiderd\n\n# Installed <=969 updaters accept exactly haider + haiderd. Embed the\n# already signed split executables as data, then sign this legacy\n# entry point. Its staging probes are read-only; first normal use\n# publishes the embedded bundle through the same durable transaction.\nHAIDER_THIN_EXE=\"$PWD/target/${{ matrix.target }}/release/haider\" \\\nHAIDER_TUI_EXE=\"$PWD/target/${{ matrix.target }}/release/haider-tui\" \\\n  cargo build --release --locked -p haider-compat \\\n    --features\
        \ embedded-bundle --target ${{ matrix.target }}\ncodesign --force --options runtime --timestamp \\\n  --identifier ai.haidercode.haider.compat \\\n  --sign \"$IDENTITY\" \\\n  target/${{ matrix.target }}/release/haider-compat\ncodesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider-compat\ntarget/${{ matrix.target }}/release/haider-compat self-test | grep '\"ok\":true'\n"
    - name: smoke (binary runs + self-test; strict version match on tag builds)
      shell: bash
      run: "EXE=\"\"; [ \"$RUNNER_OS\" = \"Windows\" ] && EXE=\".exe\"\nBIN=target/${{ matrix.target }}/release/haider$EXE\nTBIN=target/${{ matrix.target }}/release/haider-tui$EXE\n\"$TBIN\" --version\n\"$BIN\" self-test | grep '\"ok\":true'\nif [ \"$RUNNER_OS\" != \"Windows\" ]; then file \"$BIN\"; fi\nif [ \"${{ github.event_name }}\" = \"push\" ]; then\n  TAG=\"${GITHUB_REF_NAME#v}\"\n  test \"$(\"$BIN\" --version)\" = \"haider $TAG\"\n  test \"$(\"$TBIN\" --version)\" = \"haider-tui $TAG\"\nelse\n  \"$BIN\" --version\nfi\n"
    - name: front door resolves a profile from a stock environment
      shell: bash
      run: "set -euo pipefail\nEXE=\"\"; [ \"$RUNNER_OS\" = \"Windows\" ] && EXE=\".exe\"\nBIN=\"$PWD/target/${{ matrix.target }}/release/haider$EXE\"\nOUT=\"$RUNNER_TEMP/front-door.txt\"\n\nif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  # Reproduce Explorer/PowerShell: USERPROFILE present, HOME absent.\n  env -u HOME -u HAIDER_PROFILE_DIR \"$BIN\" --ready > \"$OUT\" 2>&1 && rc=0 || rc=$?\nelse\n  env -u HAIDER_PROFILE_DIR \"$BIN\" --ready > \"$OUT\" 2>&1 && rc=0 || rc=$?\nfi\n\ncat \"$OUT\"\nif [ \"$rc\" -ne 0 ]; then\n  echo \"::error::the front door failed with exit $rc from a stock environment\" >&2\n  exit 1\nfi\n# Belt and braces: even a zero exit must not carry the resolver error.\nif grep -qi \"cannot resolve a profile directory\" \"$OUT\"; then\n  echo \"::error::profile resolution failed -- this is the 0.0.964 Windows P0 class\" >&2\n  exit 1\nfi\n"
    - name: notarize macOS binaries
      if: runner.os == 'macOS'
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      run: "set -euo pipefail\n\nfor name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID MACOS_SIGNING_CERT_P12_BASE64 MACOS_SIGNING_CERT_PASSWORD; do\n  if [ -z \"${!name:-}\" ]; then\n    echo \"SKIP: macOS binary notarization; secret $name is absent\"\n    exit 0\n  fi\ndone\n\nPAYLOAD=\"$RUNNER_TEMP/haider-notarization-${{ matrix.target }}\"\nARCHIVE=\"$RUNNER_TEMP/haider-notarization-${{ matrix.target }}.zip\"\nRESULT=\"$RUNNER_TEMP/haider-notarization-result.json\"\nmkdir -p \"$PAYLOAD\"\ncp target/${{ matrix.target }}/release/haider \"$PAYLOAD/\"\ncp target/${{ matrix.target }}/release/haider-tui \"$PAYLOAD/\"\ncp target/${{ matrix.target }}/release/haider-compat \"$PAYLOAD/\"\ncp target/${{ matrix.target }}/release/haiderd \"$PAYLOAD/\"\nditto -c -k --keepParent \"$PAYLOAD\" \"$ARCHIVE\"\n\nxcrun notarytool submit \"$ARCHIVE\" \\\n  --apple-id \"$APPLE_ID\" \\\n  --password \"$APPLE_PASSWORD\" \\\n  --team-id \"$APPLE_TEAM_ID\" \\\n  --wait --timeout 20m --output-format json > \"$RESULT\"\
        \n\njq '{id, status, message}' \"$RESULT\"\nSTATUS=\"$(jq -r '.status // empty' \"$RESULT\")\"\nSUBMISSION_ID=\"$(jq -r '.id // empty' \"$RESULT\")\"\nif [ \"$STATUS\" != \"Accepted\" ]; then\n  if [ -n \"$SUBMISSION_ID\" ]; then\n    xcrun notarytool log \"$SUBMISSION_ID\" \\\n      --apple-id \"$APPLE_ID\" \\\n      --password \"$APPLE_PASSWORD\" \\\n      --team-id \"$APPLE_TEAM_ID\"\n  fi\n  echo \"Apple notarization failed with status: ${STATUS:-unknown}\" >&2\n  exit 1\nfi\n\n# stapler cannot attach tickets to raw Mach-O files or ZIP archives.\n# Apple publishes the nested-binary tickets for Gatekeeper to resolve\n# online; the exact signed bytes are packaged below without mutation.\n"
    - name: archive daemon symbols by native build ID
      shell: bash
      run: "set -euo pipefail\n\nEXE=\"\"; [ \"$RUNNER_OS\" = \"Windows\" ] && EXE=\".exe\"\nRELEASE_DIR=target/${{ matrix.target }}/release\nDBIN=\"$RELEASE_DIR/haiderd$EXE\"\nARCHIVER=\"$RELEASE_DIR/haider-symbol-archive$EXE\"\ncase \"$RUNNER_OS\" in\n  macOS) SYMBOLS=\"$RELEASE_DIR/haiderd.dSYM\" ;;\n  Linux) SYMBOLS=\"$RELEASE_DIR/haiderd.dwp\" ;;\n  Windows) SYMBOLS=\"$RELEASE_DIR/haiderd.pdb\" ;;\n  *) echo \"Unsupported symbol platform: $RUNNER_OS\" >&2; exit 1 ;;\nesac\n\n\"$ARCHIVER\" \"$DBIN\" \"$SYMBOLS\" \"symbols/${{ matrix.target }}\"\ndu -sh \"symbols/${{ matrix.target }}\"\n"
    - name: package
      shell: bash
      run: "EXE=\"\"; [ \"$RUNNER_OS\" = \"Windows\" ] && EXE=\".exe\"\nBIN=target/${{ matrix.target }}/release/haider$EXE\nTBIN=target/${{ matrix.target }}/release/haider-tui$EXE\nDBIN=target/${{ matrix.target }}/release/haiderd$EXE\nWBIN=target/${{ matrix.target }}/release/haider-wayland-portal\nREF=\"${GITHUB_REF_NAME:-manual}\"\nNAME=haider-${REF}-${{ matrix.target }}-split\nmkdir -p dist/$NAME\n# All runtime siblings belong to the same versioned split bundle.\ncp \"$BIN\" \"$TBIN\" \"$DBIN\" dist/$NAME/\nif [ \"$RUNNER_OS\" = \"Linux\" ]; then cp \"$WBIN\" dist/$NAME/; fi\nif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  # haider.exe is a CONSOLE binary. Double-clicked from Explorer,\n  # Windows destroys the console the instant the process exits and\n  # takes any error with it -- the reported \"blank window for a\n  # second, then disappears\". Ship a launcher that holds the window\n  # open on a non-zero exit, and a README covering the SmartScreen\n  # prompt that an unsigned binary\
        \ necessarily produces.\n  # printf, not a heredoc: a heredoc terminator must sit at column 0\n  # and would break this YAML block scalar.\n  printf '%s\\r\\n' \\\n    '@echo off' \\\n    'cd /d \"%~dp0\"' \\\n    'haider.exe %*' \\\n    'set HAIDER_EXIT=%ERRORLEVEL%' \\\n    'if not \"%HAIDER_EXIT%\"==\"0\" (' \\\n    '  echo.' \\\n    '  echo haider exited with code %HAIDER_EXIT%.' \\\n    '  echo The message above is the reason.' \\\n    '  echo Report it at https://github.com/Rizzist/haider-agent/issues' \\\n    '  echo.' \\\n    '  pause' \\\n    ')' \\\n    'exit /b %HAIDER_EXIT%' > \"dist/$NAME/haider.cmd\"\n  printf '%s\\r\\n' \\\n    'Haider for Windows' \\\n    '==================' \\\n    '' \\\n    'RUN IT' \\\n    '  Double-click haider.cmd  (not haider.exe -- see below)' \\\n    '' \\\n    '  Or from a terminal, which is better because you keep the output:' \\\n    '      cd path\\to\\this\\folder' \\\n    '      haider.exe' \\\n    '' \\\n    '  haider.exe is a console\
        \ program. Double-clicked from Explorer,' \\\n    '  Windows closes the window the moment it exits, so you never get' \\\n    '  to read an error. haider.cmd keeps the window open on failure.' \\\n    '' \\\n    '\"WINDOWS PROTECTED YOUR PC\"' \\\n    '  These binaries are not yet code-signed, so SmartScreen warns and' \\\n    '  Defender may quarantine them. That warning is about the ABSENCE' \\\n    '  of a signature, not about detected malicious behaviour.' \\\n    '  To run anyway: click \"More info\", then \"Run anyway\".' \\\n    '' \\\n    '  Verify what you downloaded -- the release page publishes a' \\\n    '  SHA-256 next to the zip:' \\\n    '      certutil -hashfile <the-zip-you-downloaded> SHA256' \\\n    '' \\\n    'KEEP ALL THREE FILES TOGETHER' \\\n    '  haider.exe starts haider-tui.exe and haiderd.exe from its folder.' \\\n    '  Moving any sibling breaks it. To put haider on PATH, add this' \\\n    '  whole folder rather than copying haider.exe elsewhere.' \\\n\
        \    '' \\\n    'Source, releases and issues:' \\\n    '  https://github.com/Rizzist/haider-agent' > \"dist/$NAME/README.txt\"\n  # Zip is the native Windows archive expectation; Explorer opens it\n  # without extra tooling and sha256sum ships with Git Bash.\n  (cd dist && 7z a -tzip \"$NAME.zip\" \"$NAME\" > /dev/null)\n  (cd dist && sha256sum \"$NAME.zip\" > \"$NAME.zip.sha256\")\nelse\n  tar -C dist -cJf dist/$NAME.tar.xz $NAME\n  (cd dist && shasum -a 256 \"$NAME.tar.xz\" > \"$NAME.tar.xz.sha256\")\nfi\n"
    - name: verify complete split archive and checksum
      shell: bash
      run: 'EXT=tar.xz; [ "$RUNNER_OS" = "Windows" ] && EXT=zip

        NAME=haider-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}-split

        python scripts/release_packaging.py verify-bundle --artifact "dist/$NAME.$EXT" --target "${{ matrix.target }}"

        '
    - name: package compatibility assets for installed two-member macOS updaters
      if: runner.os == 'macOS'
      shell: bash
      run: "set -euo pipefail\nNAME=haider-${GITHUB_REF_NAME:-manual}-${{ matrix.target }}\nmkdir -p \"dist/$NAME\"\ncp target/${{ matrix.target }}/release/haider-compat \"dist/$NAME/haider\"\ncp target/${{ matrix.target }}/release/haiderd \"dist/$NAME/haiderd\"\ntar -C dist -cJf \"dist/$NAME.tar.xz\" \"$NAME\"\n(cd dist && shasum -a 256 \"$NAME.tar.xz\" > \"$NAME.tar.xz.sha256\")\npython3 scripts/release_packaging.py verify-legacy-bundle \\\n  --artifact \"dist/$NAME.tar.xz\" --target ${{ matrix.target }}\n"
    - name: upload distribution archives
      uses: actions/upload-artifact@v4
      with:
        name: distribution-${{ matrix.target }}
        path: 'dist/*.tar.*

          dist/*.zip*

          '
        if-no-files-found: error
    - name: upload native-ID-keyed daemon symbols (30 days)
      uses: actions/upload-artifact@v4
      with:
        name: symbols-${{ matrix.target }}
        path: symbols/${{ matrix.target }}/
        if-no-files-found: error
        retention-days: 30
  installers:
    name: Additional installers (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: distribution-${{ matrix.target }}
        path: archives
    - name: Freeze exact archive members and checksums
      shell: bash
      run: "set -euo pipefail\nVERSION=$(python -c 'import tomllib; print(tomllib.load(open(\"Cargo.toml\", \"rb\"))[\"workspace\"][\"package\"][\"version\"])')\necho \"INSTALLER_VERSION=$VERSION\" >> \"$GITHUB_ENV\"\npython scripts/installer_payload.py --archives archives --output payload \\\n  --version \"$VERSION\" --target '${{ matrix.target }}'\nEXE=\"\"; [ \"$RUNNER_OS\" != Windows ] || EXE=.exe\ntest \"$(payload/haider$EXE --version)\" = \"haider $VERSION\"\n"
    - name: Packaging regression tests
      shell: bash
      env:
        HAIDER_INSTALL_TEST_BIN_DIR: payload
      run: python -m unittest discover -s scripts/tests -p 'test_*.py'
    - name: Install native Linux package tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm cpio libasound2t64 libglib2.0-0t64
    - name: Build and inspect deb/rpm
      if: runner.os == 'Linux'
      run: "python3 packaging/installers/linux-build.py --payload payload --output installers \\\n  --version \"$INSTALLER_VERSION\" --target '${{ matrix.target }}'\n"
    - name: Linux T1 install upgrade remove purge in containers
      if: runner.os == 'Linux'
      run: bash scripts/qa-gate/installers-linux.sh payload installers "$INSTALLER_VERSION" '${{ matrix.target }}'
    - name: Build inspect sign notarize macOS pkg and dmg
      if: runner.os == 'macOS'
      env:
        MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
        MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: bash packaging/installers/macos-build.sh payload installers "$INSTALLER_VERSION" '${{ matrix.target }}'
    - name: Install Inno Setup
      if: runner.os == 'Windows'
      shell: pwsh
      run: "if (!(Test-Path \"${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe\")) {\n  choco install innosetup --yes --no-progress\n  if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }\n}\n"
    - name: Build sign and inspect Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      run: "./packaging/installers/windows-build.ps1 -Payload payload -Manifest payload/manifest.json `\n  -Version $env:INSTALLER_VERSION -Target '${{ matrix.target }}' -Output installers\n"
    - name: Publish tarball uninstaller as additional asset
      if: runner.os != 'Windows'
      shell: bash
      run: 'NAME="haider-v${INSTALLER_VERSION}-${{ matrix.target }}-uninstall-haider.sh"

        cp payload/uninstall-haider.sh "installers/$NAME"

        (cd installers && shasum -a 256 "$NAME" > "$NAME.sha256")

        '
    - name: Upload verified additional assets
      uses: actions/upload-artifact@v4
      with:
        name: installers-${{ matrix.target }}
        path: 'installers/*.exe

          installers/*.pkg

          installers/*.dmg

          installers/*.deb

          installers/*.rpm

          installers/*-uninstall-haider.sh

          installers/*.sha256

          '
        if-no-files-found: error
