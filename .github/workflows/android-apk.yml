name: android-apk

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ['android/**', 'crates/**', 'scripts/android/**', 'Cargo.*', 'rust-toolchain.toml', 'customprov.bundle', '.cargo/config.toml', '.github/workflows/android-apk.yml']
  schedule:
    - cron: '21 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.source.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$({
            awk '
              /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*"/, "", value)
                sub(/".*/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          })"
          test -n "$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION" || {
              echo "tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: digest Rust inputs and native build recipe
        id: source
        run: echo "digest=$(python3 scripts/android/build-native.py --source-digest)" >> "$GITHUB_OUTPUT"

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-host-tests
      - name: host embedding, policy, vault, RPC and lifecycle tests
        run: cargo test --locked -p haider-android -p haider-rpc -p haider-accounts -p haider-daemon -p haider-platform

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      # A reclaimed runner must not cancel the other ABI's durable checkpoint.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: install pinned NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: native verification script tests
        run: python3 -m unittest discover -s scripts/android -p 'test_*.py'
      - name: restore verified native output (exact source and ABI only)
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/generated/haiderNative
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-${{ needs.prepare.outputs.source }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          shared-key: android-native-${{ matrix.abi }}
      - name: install pinned cargo-ndk
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: build native cdylib with release fat LTO and API 26
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ABI: ${{ matrix.abi }}
        run: python3 scripts/android/build-native.py --output android/app/build/generated/haiderNative --version "$VERSION" --abi "$ABI"
      - name: verify built or restored native output and debug companions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ABI: ${{ matrix.abi }}
        run: python3 scripts/android/build-native.py --output android/app/build/generated/haiderNative --version "$VERSION" --abi "$ABI" --verify-only
      # Save now, not in a post-job hook after packaging or unrelated tests.
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: android/app/build/generated/haiderNative
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: pass verified JNI libraries and unstripped symbols by ELF build ID
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-native-build-${{ matrix.abi }}
          path: android/app/build/generated/haiderNative/**
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build-apk:
    needs: [prepare, host-tests, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: install pinned SDK and NDK for verification
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: haider-android-native-build-*
          path: dist-android-native
          merge-multiple: true
      - name: verify both native artifacts against this checkout before signing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/android/build-native.py --output dist-android-native --version "$VERSION" --verify-only
      - name: archive unstripped native symbols by ELF build ID
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-native-symbols
          path: dist-android-native/symbols/**
          if-no-files-found: error
          overwrite: true

      - name: test and assemble release APK
        id: assemble
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/haider-release.jks"
          cleanup() { rm -f "$KEYSTORE"; }
          trap cleanup EXIT INT TERM

          SIGNING_READY=false
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            SIGNING_READY=true
          else
            echo "::notice::signing skipped: secrets absent"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$SIGNING_READY" != true ]; then
            echo "::error::tag release requires the existing Android release signing key"
            exit 1
          fi
          unset ANDROID_KEYSTORE_B64

          export ANDROID_KEYSTORE_PATH="$KEYSTORE"
          gradle -p buildSrc test --no-daemon -Dorg.gradle.jvmargs=-Xmx3g --max-workers=2 --stacktrace
          gradle :app:testPhoneReleaseUnitTest :app:testEmulatorDebugUnitTest :app:assemblePhoneRelease :app:assembleEmulatorDebug :app:assembleEmulatorDebugAndroidTest \
            -PhaiderNativePrebuilt=true \
            -PhaiderVersion="${{ needs.prepare.outputs.version }}" \
            --no-daemon -Dorg.gradle.jvmargs=-Xmx3g --max-workers=2 --stacktrace

          if [ "$SIGNING_READY" = true ]; then
            mapfile -t APKS < <(find app/build/outputs/apk/phone/release -maxdepth 1 -type f -name '*.apk' -print)
            test "${#APKS[@]}" -eq 1
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            test -x "$APKSIGNER" || {
              echo "Android build-tools 35.0.0 apksigner is unavailable" >&2
              exit 1
            }
            VERIFY="$("$APKSIGNER" verify --verbose "${APKS[0]}")"
            printf '%s\n' "$VERIFY"
            for scheme in v2 v3; do
              grep -Eq "Verified using $scheme scheme.*: true" <<< "$VERIFY" || {
                echo "release APK is missing required $scheme signing" >&2
                exit 1
              }
            done
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::unsigned release build completed; APK artifact upload skipped"
          fi

      - name: verify APK version, native ABI contents and 16 KiB ZIP alignment
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          LLVM="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          for entry in 'phone/release arm64-v8a' 'emulator/debug x86_64'; do
            read -r variant abi <<< "$entry"
            mapfile -t APKS < <(find "android/app/build/outputs/apk/$variant" -maxdepth 1 -name '*.apk')
            test "${#APKS[@]}" -eq 1
            python3 scripts/android/verify-native.py --apk "${APKS[0]}" --abi "$abi" --version "$VERSION" \
              --readelf "$LLVM/llvm-readelf" --zipalign "$BT/zipalign" --aapt2 "$BT/aapt2"
          done

      - name: archive emulator APK and instrumentation
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-emulator-tests
          path: |
            android/app/build/outputs/apk/emulator/debug/*.apk
            android/app/build/outputs/apk/androidTest/emulator/debug/*.apk
          if-no-files-found: error
          overwrite: true

      - name: stage APK and checksum
        if: steps.assemble.outputs.signed == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/phone/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1 || {
            echo "expected exactly one release APK, found ${#APKS[@]}" >&2
            exit 1
          }
          mkdir -p dist-android
          APK_NAME="haider-v${VERSION}-android.apk"
          cp "${APKS[0]}" "dist-android/$APK_NAME"
          (cd dist-android && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: upload release APK and checksum
        if: steps.assemble.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haider-android-release
          path: dist-android/*
          if-no-files-found: error
          overwrite: true

  emulator-pr:
    # Registry #80: advisory until the first recorded green GitHub runner execution.
    continue-on-error: true
    needs: build-apk
    runs-on: ubuntu-24.04
    # Downloads prebuilt APKs; no cold native compilation needs extra time here.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: haider-android-emulator-tests
          path: emulator-apks
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: python3 scripts/android/emulator-gate.py --serial emulator-5554 --owned-emulator --apks emulator-apks --tier pr --evidence emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-pr-evidence
          path: emulator-evidence/**
          if-no-files-found: error

  emulator-nightly:
    # Advisory stubs exercise actual reboot/Doze and a real 16 KiB image. Never fake protected broadcasts.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: build-apk
    runs-on: ubuntu-24.04
    # Both tiers download prebuilt APKs; retain the existing runtime-test budget.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: nightly
            target: google_apis
          - tier: 16k
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: haider-android-emulator-tests
          path: emulator-apks
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: ${{ matrix.target }}
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: python3 scripts/android/emulator-gate.py --serial emulator-5554 --owned-emulator --apks emulator-apks --tier ${{ matrix.tier }} --evidence emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-${{ matrix.tier }}-evidence
          path: emulator-evidence/**
          if-no-files-found: error
