name: xplat-check
# Fast cross-platform compile check — the iteration loop for the Windows
# port. `cargo check --all-targets` surfaces type/cfg errors in minutes
# without a full build; Windows has no local toolchain on the dev box, so
# this workflow IS the Windows compiler.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: check (all targets — lib + bins + tests compile)
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: clippy (all targets)
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      # The cross-platform TEST loop (owner bar: tests green on every OS
      # before the next release). Per-crate for the same load-isolation
      # reasons as ci.yml; Git Bash serves this script on Windows.
      - name: test (per-crate)
        shell: bash
        # ci-test.sh gives every OS the production daemon's 8 MiB stack
        # default while preserving a non-empty caller override.
        run: bash scripts/ci-test.sh

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: install Android Rust target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false
      - name: configure Android NDK toolchain
        shell: bash
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$toolchain" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$toolchain/llvm-ranlib" >> "$GITHUB_ENV"
      - name: build Android Phase 1 binaries
        run: cargo build --locked --target aarch64-linux-android -p haider-cli -p haider-daemond
      - name: compile Android Kotlin app
        working-directory: android
        run: gradle :app:compileReleaseKotlin --no-daemon --stacktrace
