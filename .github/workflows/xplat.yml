name: xplat-check
on:
  push:
    # main is fast-forwarded to the tested wave SHA. Missing exact-SHA
    # evidence is dispatched by require-evidence.sh, including direct main work.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: ${{ matrix.phase }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            phase: check
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            phase: clippy
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            phase: test
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            phase: check
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            phase: clippy
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            phase: test
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows installer compile check (advisory)
        if: runner.os == 'Windows' && matrix.phase == 'check'
        # Registry #80: advisory until its first green CI run, then make required.
        continue-on-error: true
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          ./packaging/installers/windows-compile-check.ps1
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xplat-${{ matrix.phase }}-${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: check (all targets; report every reachable error)
        if: matrix.phase == 'check'
        run: cargo check --workspace --all-targets --locked --keep-going --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        if: matrix.phase != 'clippy'
        with:
          node-version: 20
      - name: split archive and wrapper delegation regression tests
        if: matrix.phase == 'check'
        run: python -m unittest scripts/tests/test_release_packaging.py scripts/tests/test_install_bundle.py
      - name: clippy (all targets; report every reachable error)
        if: matrix.phase == 'clippy'
        run: cargo clippy --workspace --all-targets --locked --keep-going --target ${{ matrix.target }} -- -D warnings
      - name: test (per-crate, collect all failures)
        if: matrix.phase == 'test'
        shell: bash
        # ci-test.sh preserves the 8 MiB stack, hermetic discovery/device env,
        # sibling-binary compile phase, and the Windows-only streamed test.
        run: bash scripts/ci-test.sh
      - name: native durable bundle installation and version checks
        if: matrix.phase == 'test'
        env:
          HAIDER_INSTALL_TEST_BIN_DIR: target/debug
          RUST_MIN_STACK: 8388608
          HAIDER_DISCOVERY_DISABLED: 1
          HAIDER_TEST_DEVICE_NAME: test-mac
        run: python -m unittest scripts/tests/test_install_bundle_native.py
      - name: thin executable dependency and binary boundary
        if: matrix.phase == 'test'
        run: python scripts/qa-gate/thinexe_abba.py boundary --candidate target/debug --target ${{ matrix.target }} --output target/ci-test-logs/thinexe-boundary.json
      - name: native Windows clipboard write and paste gate (no terminal)
        if: matrix.phase == 'test' && runner.os == 'Windows'
        env:
          RUST_MIN_STACK: 8388608
          HAIDER_DISCOVERY_DISABLED: 1
          HAIDER_TEST_DEVICE_NAME: test-mac
          HAIDER_TEST_SIBLINGS_PREBUILT: 1
        # No ignore/env escape hatch: a missing clipboard fails this gate.
        # This also runs in the normal suite; naming it here keeps native
        # Windows clipboard execution visible in the cross-platform gate.
        run: cargo test -p haider-tui --locked --test w970_winclip_windows_tests -- --test-threads=1
      - name: upload failing test logs
        if: failure() && matrix.phase == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-failures-${{ matrix.target }}
          path: target/ci-test-logs/**
          if-no-files-found: error
          retention-days: 14

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: install Android Rust target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-fast-build
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false
      - name: configure Android NDK toolchain
        shell: bash
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          toolchain="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$toolchain" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$toolchain/llvm-ranlib" >> "$GITHUB_ENV"
      - name: build Android Phase 1 binaries
        run: cargo build --locked --target aarch64-linux-android -p haider-cli -p haider-daemond -p haider-tui-exe
      - name: compile Android Kotlin app
        working-directory: android
        run: gradle :app:compileReleaseKotlin --no-daemon --stacktrace
