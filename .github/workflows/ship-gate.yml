name: ship-gate
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # Static workflow name avoids sharing the caller's group when release.yml
  # invokes this reusable workflow.
  group: ship-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  behaviour:
    name: probe ladder (demo + live, CI profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-behaviour-ci-profile
      - name: probe ladder (demo + live)
        run: |
          # Journal rows are msgpack blobs since v0.0.931; without the module
          # the reader skips every row.
          python3 -m pip install --break-system-packages msgpack
          cargo build --profile ci -p haider-cli -p haider-daemond --locked
          NO_COLOR=1 CLICOLOR=0 HAIDER_TEST_DEVICE_NAME=test-mac \
            scripts/tui-probes/ladder.sh \
              "$GITHUB_WORKSPACE/target/ci/haider" \
              "$GITHUB_WORKSPACE/target/ci/haiderd"

  render-benchmark:
    name: render benchmark (true release profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-render-release-profile
      # Ledger row 17 enforces calibrated upper bounds only. The
      # minimum_duration assertion selects min-vs-max samples; it is not a
      # lower performance floor. Calibrating a no-op/implausibly-fast guard is
      # an explicit 966 task. This job deliberately stays --release.
      - name: render benchmark (release — ledger row 17 upper bounds)
        run: cargo test --release -p haider-tui --test w3c3_render_bench_tests --locked

  daemon-footprint:
    name: daemon footprint budget (release profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-daemon-footprint-release-profile
      - name: build daemon and deterministic footprint driver
        env:
          RUST_MIN_STACK: 8388608
          HAIDER_DISCOVERY_DISABLED: 1
          HAIDER_TEST_DEVICE_NAME: test-mac
        run: |
          cargo build --release --locked -p haider-daemond
          cargo build --locked -p haider-client --example memdaemon_workload
      - name: enforce settled daemon footprint budgets
        run: >-
          python3 scripts/perf/daemon-footprint-budget.py
          --daemon "$GITHUB_WORKSPACE/target/release/haiderd"
          --driver "$GITHUB_WORKSPACE/target/debug/examples/memdaemon_workload"
          --output "$GITHUB_WORKSPACE/target/daemon-footprint/measurement.json"
          --artifacts-dir "$GITHUB_WORKSPACE/target/daemon-footprint/process-reports"
      - name: upload daemon footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-footprint-release
          path: target/daemon-footprint/**
          if-no-files-found: error
          retention-days: 14

  client-footprint:
    name: client footprint (settled macOS release)
    # Registry #80: typed run terminality is distinct from aggregate session
    # settlement. TODO(2026-09-02): after three consecutive green runs of this
    # job on main, land a follow-up that removes continue-on-error and records
    # those run IDs in docs/testing/v0.0.970/cfbcal.md. Tag/reusable runs do not
    # count toward the three-run registry note.
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-client-footprint-release-profile
      - name: footprint harness self-test
        run: python3 scripts/perf/client-footprint-budget.py --self-test
      - name: build release client and daemon
        env:
          RUST_MIN_STACK: 8388608
          HAIDER_DISCOVERY_DISABLED: 1
          HAIDER_TEST_DEVICE_NAME: test-mac
        run: |
          cargo build --release -p haider-cli -p haider-daemond --locked
          test "$(stat -f %z target/release/haiderd)" -gt 10485760
      - name: calibrate and enforce settled client footprint budgets (N=5)
        run: |
          mkdir -p "$RUNNER_TEMP/client-footprint"
          failures=0
          calibrate_surface() {
            local surface="$1"
            local output="$2"
            local budget="$3"
            if ! python3 scripts/perf/client-footprint-budget.py \
              --haider target/release/haider \
              --surface "$surface" \
              --output "$RUNNER_TEMP/client-footprint/$output" \
              --calibrate \
              --runs 5 \
              --budget-bytes "$budget"
            then
              failures=$((failures + 1))
            fi
          }

          # Runner evidence and provisional gaps are documented in cfbcal.md.
          calibrate_surface status-post-command status 2938637
          calibrate_surface run-post-command run 3794948
          calibrate_surface tui-demo-sixel tui-sixel 6344334
          if (( failures != 0 )); then
            echo "$failures client-footprint surface(s) failed; available calibration evidence was retained" >&2
            exit 1
          fi
      - name: upload footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-footprint-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-footprint
          if-no-files-found: error
          retention-days: 90
