name: ship-gate
on:
  workflow_call:
    outputs:
      artifact_run_id:
        description: Run holding the exact-SHA unsigned macOS release artifact
        value: ${{ jobs.verdict.outputs.artifact_run_id }}
  workflow_dispatch:
  push:
    branches: [wave-*, main]

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize the same candidate across wave/main/reusable calls, then reuse
  # completed evidence. Never cancel the measurement that a tag is waiting on.
  group: ship-gate-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  reuse:
    name: completed ship-gate evidence for this SHA
    runs-on: ubuntu-latest
    outputs:
      satisfied: ${{ steps.lookup.outputs.satisfied }}
      artifact_run_id: ${{ steps.lookup.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/find-evidence.py ship-gate.yml "$GITHUB_SHA"
          --artifact "release-build-aarch64-apple-darwin-$GITHUB_SHA"

  evidence:
    needs: reuse
    if: needs.reuse.outputs.satisfied != 'true'
    name: exact-SHA cross-platform and CI evidence
    runs-on: ubuntu-latest
    # 2 workflows * 120 polls * 60 s = 240 min, plus 5 min setup/API margin.
    timeout-minutes: 245
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: require completed successful evidence for the caller SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ github.sha }}
        run: bash scripts/release/require-evidence.sh "$EVIDENCE_SHA"

  build-macos-release:
    needs: reuse
    if: needs.reuse.outputs.satisfied != 'true'
    name: shared macOS release build (aarch64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release-aarch64
      - name: build unsigned release payload
        run: |
          source scripts/release/macos-release-env.sh
          cargo build --release --locked -p haider-cli -p haider-tui-exe -p haider-daemond --target aarch64-apple-darwin
          python3 scripts/release/macos-build-artifact.py pack --sha "$GITHUB_SHA" --bundle release-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-aarch64-apple-darwin-${{ github.sha }}
          path: release-build/
          if-no-files-found: error
          retention-days: 14

  behaviour:
    needs: reuse
    if: needs.reuse.outputs.satisfied != 'true'
    name: probe ladder (demo + live, CI profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-behaviour-ci-profile
      - name: probe ladder (demo + live)
        run: |
          # Journal rows are msgpack blobs since v0.0.931; without the module
          # the reader skips every row.
          python3 -m pip install --break-system-packages msgpack
          cargo build --profile ci -p haider-cli -p haider-daemond -p haider-tui-exe --locked
          NO_COLOR=1 CLICOLOR=0 HAIDER_TEST_DEVICE_NAME=test-mac \
            scripts/tui-probes/ladder.sh \
              "$GITHUB_WORKSPACE/target/ci/haider" \
              "$GITHUB_WORKSPACE/target/ci/haiderd"

  render-benchmark:
    needs: reuse
    if: needs.reuse.outputs.satisfied != 'true'
    name: render benchmark (true release profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release-aarch64
      # Ledger row 17 is a shape gate: first and cached frames fit 33 ms at
      # 10k/50k/200k, with the curve flat in N. This job deliberately stays
      # --release; debug builds announce a timing SKIP.
      - name: virtual transcript shape (release — ledger row 17)
        run: cargo test --release --target aarch64-apple-darwin -p haider-tui --test tuivirt_shape_bench_tests --locked -- --nocapture

  daemon-footprint:
    needs: build-macos-release
    name: daemon footprint budget (release profile)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-daemon-footprint-release-profile
      - uses: actions/download-artifact@v4
        with:
          name: release-build-aarch64-apple-darwin-${{ github.sha }}
          path: release-build
      - name: verify and restore unsigned release payload
        run: |
          source scripts/release/macos-release-env.sh
          python3 scripts/release/macos-build-artifact.py restore --sha "$GITHUB_SHA" --bundle release-build
      - name: build deterministic footprint driver
        env:
          RUST_MIN_STACK: 8388608
          HAIDER_DISCOVERY_DISABLED: 1
          HAIDER_TEST_DEVICE_NAME: test-mac
        run: |
          cargo build --locked -p haider-client --example memdaemon_workload
      - name: enforce settled daemon footprint budgets
        run: >-
          python3 scripts/perf/daemon-footprint-budget.py
          --daemon "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/haiderd"
          --driver "$GITHUB_WORKSPACE/target/debug/examples/memdaemon_workload"
          --output "$GITHUB_WORKSPACE/target/daemon-footprint/measurement.json"
          --artifacts-dir "$GITHUB_WORKSPACE/target/daemon-footprint/process-reports"
      - name: upload daemon footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-footprint-release
          path: target/daemon-footprint/**
          if-no-files-found: error
          retention-days: 14

  client-footprint:
    needs: build-macos-release
    name: client footprint (settled macOS release)
    # Registry #80: typed run terminality is distinct from aggregate session
    # settlement. TODO(2026-09-02): after three consecutive green runs of this
    # job on main, land a follow-up that removes continue-on-error and records
    # those run IDs in docs/testing/v0.0.970/cfbcal.md. Tag/reusable runs do not
    # count toward the three-run registry note.
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-ship-client-footprint-release-profile
      - name: footprint harness self-test
        run: python3 scripts/perf/client-footprint-budget.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: release-build-aarch64-apple-darwin-${{ github.sha }}
          path: release-build
      - name: verify and restore unsigned release payload
        run: |
          source scripts/release/macos-release-env.sh
          python3 scripts/release/macos-build-artifact.py restore --sha "$GITHUB_SHA" --bundle release-build
      - name: require a full release daemon
        run: test "$(stat -f %z target/aarch64-apple-darwin/release/haiderd)" -gt 10485760
      - name: calibrate and enforce settled client footprint budgets (N=5)
        run: |
          mkdir -p "$RUNNER_TEMP/client-footprint"
          failures=0
          calibrate_surface() {
            local surface="$1"
            local output="$2"
            local budget="$3"
            if ! python3 scripts/perf/client-footprint-budget.py \
              --haider target/aarch64-apple-darwin/release/haider \
              --surface "$surface" \
              --output "$RUNNER_TEMP/client-footprint/$output" \
              --calibrate \
              --runs 5 \
              --budget-bytes "$budget"
            then
              failures=$((failures + 1))
            fi
          }

          # N=5 release runner calibration: docs/testing/v0.0.970/shipgate.md.
          # Freed allocator pages explain the run/Sixel drift; retain 10%
          # median headroom and enforce every sample (no percentile waiver).
          calibrate_surface status-post-command status 2938637
          calibrate_surface run-post-command run 4326503
          calibrate_surface tui-demo-sixel tui-sixel 6795712
          if (( failures != 0 )); then
            echo "$failures client-footprint surface(s) failed; available calibration evidence was retained" >&2
            exit 1
          fi
      - name: upload footprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-footprint-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-footprint
          if-no-files-found: error
          retention-days: 90

  verdict:
    name: verdict
    if: always()
    needs: [reuse, evidence, build-macos-release, behaviour, render-benchmark, daemon-footprint, client-footprint]
    runs-on: ubuntu-latest
    outputs:
      artifact_run_id: ${{ steps.verdict.outputs.artifact_run_id }}
    steps:
      - name: require every gate or completed exact-SHA reuse
        id: verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          REUSED: ${{ needs.reuse.outputs.satisfied }}
          ARTIFACT_RUN_ID: ${{ needs.reuse.outputs.artifact_run_id }}
        run: |
          if [ "$REUSED" = true ]; then
            jq -e '.reuse.result == "success"' <<< "$RESULTS"
          else
            # Skipped/cancelled dependencies are failures too. The existing
            # client job retains its documented registry-#80 advisory policy.
            jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
            ARTIFACT_RUN_ID="$GITHUB_RUN_ID"
          fi
          echo "artifact_run_id=$ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"
