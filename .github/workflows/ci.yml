name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# PIPELINE CONTRACT — capability may move, but it may not disappear.
# FAST PATH (every branch push, every PR, and dispatch): this workflow runs
# macOS fmt/clippy/repo guards/self-test, the full per-crate macOS tests, and
# the Linux X11 computer-use E2E. xplat.yml concurrently runs check, clippy,
# and the same full tests on Linux + Windows, plus the Android native/Kotlin
# build. SHIP GATE: ship-gate.yml runs the complete demo+live PTY probe ladder
# with profile.ci and the upper-bound render benchmark with the true release
# profile. It runs automatically on main, is a required `needs` dependency of
# release.yml for every v* tag/manual release build, and can be invoked before
# tagging with `gh workflow run ship-gate.yml --ref <candidate-ref>`; the
# ship gate first requires successful ci.yml and xplat.yml runs on the exact
# caller SHA, dispatching missing evidence. The local scripts/ship-970.sh
# pregate uses the same resolver before tagging. release.yml and the Android
# release workflows continue to build actual artifacts with release settings.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: lint + repository guards (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-lint
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (all targets; report every reachable error)
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: repo guards
        run: cargo run -p xtask -- check
      - name: release packaging regression tests
        run: python3 -m unittest scripts/tests/test_release_packaging.py
      - name: release evidence policy regression tests
        run: bash scripts/release/tests/require-evidence-test.sh
      - name: self-test
        env:
          # The CLI-only self-test embeds the same deep actor future that
          # production haiderd runs on explicit 8 MiB Tokio workers.
          RUST_MIN_STACK: 8388608
        run: |
          cargo build -p haider-cli --locked
          ./target/debug/haider self-test | grep '"ok":true'

  test:
    name: full tests (macOS, per crate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
      # One workspace test invocation SIGABRTs/flakes under combined fd/socket
      # pressure. The script compiles once, then runs every crate with a 15m
      # cap and Cargo --no-fail-fast so every test binary gets a turn.
      - name: test (per-crate, collect all failures)
        run: bash scripts/ci-test.sh
      - name: upload failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-failures-macos
          path: target/ci-test-logs/**
          if-no-files-found: error
          retention-days: 14

  computer-x11-e2e:
    name: computer use (Linux X11 + Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-computer-x11
      - name: install Xvfb and Wayland helper link dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev xvfb xauth
      - name: real screenshot, pixel, pointer, click, type, and key round trip
        run: >-
          HAIDER_CU_E2E=1 XDG_SESSION_TYPE=x11 WAYLAND_DISPLAY= xvfb-run --auto-servernum
          --server-args="-screen 0 320x240x24 -nolisten tcp"
          cargo test -p haider-tools --test linux_computer_e2e --locked --
          --ignored --test-threads=1
