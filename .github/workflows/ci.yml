name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: repo guards
        run: cargo run -p xtask -- check
      - name: self-test
        run: |
          cargo build -p haider-cli --locked
          ./target/debug/haider self-test | grep '"ok":true'
      # The PTY ladder is the only gate that exercises the real terminal
      # surface, and its live rows are the only proof that bare `haider`
      # reaches live mode on a real daemon (the v0.0.12 keystone). The
      # headless suite cannot see either: every live-only defect this lane
      # shipped was first caught here, not by cargo test.
      - name: probe ladder (demo + live)
        run: |
          cargo build --release -p haider-cli -p haider-daemond --locked
          NO_COLOR=1 CLICOLOR=0 scripts/tui-probes/ladder.sh
