name: ci
on:
  push:
    # main is fast-forwarded to the tested wave SHA. Missing exact-SHA
    # evidence is dispatched by require-evidence.sh, including direct main work.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# PIPELINE CONTRACT — capability may move, but it may not disappear.
# FAST PATH (branch pushes except main, PRs, and dispatch): macOS lint/tests
# and Linux X11 E2E here; Linux/Windows check/clippy/tests and Android in xplat.
# main is the exact tested wave head, so its duplicate push runs are omitted.
# SHIP GATE: wave-* and main start the demo+live probes, render benchmark and
# footprint measurements concurrently with exact-SHA ci/xplat evidence waits.
# The terminal verdict is required before tagging. Missing ci/xplat runs can
# still be dispatched on main by require-evidence.sh after resolving its SHA.
# release.yml reuses completed-success ship-gate evidence on the exact tag SHA
# from any ref, or calls the gate when missing. Never dispatch release manually.
# See docs/testing/v0.0.970/cifast.md for the pipeline and proof contract.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: lint + repository guards (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-lint
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (all targets; report every reachable error)
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: repo guards
        run: cargo run -p xtask -- check
      - name: release packaging regression tests
        run: python3 -m unittest scripts/tests/test_release_packaging.py
      - name: release evidence policy regression tests
        run: bash scripts/release/tests/require-evidence-test.sh
      - name: pipeline reuse, artifact integrity and shard regression tests
        run: python3 -m unittest scripts/tests/test_find_evidence.py scripts/tests/test_macos_build_artifact.py scripts/tests/test_ci_test_shards.py
      - name: self-test
        env:
          # The CLI dispatches its offline actor self-test to the daemon and
          # validates the matching TUI payload before reporting success.
          RUST_MIN_STACK: 8388608
        run: |
          cargo build -p haider-cli -p haider-daemond -p haider-tui-exe --locked
          ./target/debug/haider self-test | grep '"ok":true'

  test:
    name: full tests (macOS, per crate)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
      # One workspace test invocation SIGABRTs/flakes under combined fd/socket
      # pressure. The script compiles once, then runs every crate with a 15m
      # cap and Cargo --no-fail-fast so every test binary gets a turn.
      - name: test (per-crate, collect all failures)
        run: bash scripts/ci-test.sh
      - name: upload failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-failures-macos
          path: target/ci-test-logs/**
          if-no-files-found: error
          retention-days: 14

  computer-x11-e2e:
    name: computer use (Linux X11 + Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unsafe-count gate
        shell: bash
        run: bash scripts/check-unsafe-counts.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-computer-x11
      - name: install Xvfb and Wayland helper link dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev xvfb xauth
      - name: real screenshot, pixel, pointer, click, type, and key round trip
        run: >-
          HAIDER_CU_E2E=1 XDG_SESSION_TYPE=x11 WAYLAND_DISPLAY= xvfb-run --auto-servernum
          --server-args="-screen 0 320x240x24 -nolisten tcp"
          cargo test -p haider-tools --test linux_computer_e2e --locked --
          --ignored --test-threads=1
