name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual build-only run (no release published)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ship-gate:
    uses: ./.github/workflows/ship-gate.yml

  build:
    needs: ship-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: tag matches workspace version (tag builds only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      # Defender scans every intermediate artifact cargo writes -- every .rlib,
      # every object file -- which is the single largest tax on the Windows
      # runner. Combined with lto="fat" + codegen-units=1 it made the Windows
      # leg a ~2h long pole while every other platform finished in a fraction of
      # that. Excluding the build tree and the toolchain processes is the
      # cheapest available win. Best-effort: never fail a release over it.
      - name: exclude the build tree from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}\target" -ErrorAction Stop
            foreach ($p in @('rustc.exe','cargo.exe','link.exe','lld-link.exe')) {
              Add-MpPreference -ExclusionProcess $p -ErrorAction Stop
            }
            Write-Host "Defender exclusions applied for the build tree and toolchain."
          } catch {
            Write-Warning "Could not apply Defender exclusions: $_. Build continues, just slower."
          }
      - name: build
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p haider-cli -p haider-daemond --target ${{ matrix.target }}
      # WINDOWS ONLY: thin LTO across 16 codegen units instead of fat LTO in one.
      #
      # v0.0.965 added russh for cross-platform SSH, which pulls 76 crates of
      # crypto -- fiat-crypto, curve25519-dalek, elliptic-curve, crypto-bigint,
      # ml-kem, p256, ed25519-dalek. That code is heavily generic and heavily
      # inlined, so it produces an enormous amount of LLVM IR. Under
      # lto="fat" + codegen-units=1 all of it is optimised as ONE
      # single-threaded unit, and the cost is superlinear in IR size: the
      # Windows leg went from 33 minutes on v0.0.964 to over 3.5 hours on
      # v0.0.965 while every other platform stayed fast. MSVC compounds it by
      # writing the PDB single-threaded from the same link.
      #
      # Thin LTO is parallel and incremental across codegen units and recovers
      # most of fat LTO's runtime benefit for a fraction of the link cost. The
      # trade is a marginally less optimised Windows binary, which is plainly
      # worth it against a multi-hour link that risks the 6h job ceiling.
      #
      # Set via CARGO_PROFILE_RELEASE_* rather than Cargo.toml so EVERY other
      # platform keeps fat LTO byte-for-byte unchanged.
      #
      # MEASURED on the v0.0.965 re-tag: 28m42s, i.e. faster than v0.0.964's
      # 33 minutes despite 86 more crates. Record the number each release
      # rather than trusting this comment.
      - name: build (Windows, thin LTO)
        if: runner.os == 'Windows'
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p haider-cli -p haider-daemond --target ${{ matrix.target }}
      - name: build Wayland portal companion (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p haider-tools --bin haider-wayland-portal --target ${{ matrix.target }}
      - name: Developer ID sign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERT_PASSWORD:-}" ]; then
            echo "Developer ID signing secrets are required for macOS releases" >&2
            exit 1
          fi

          P12="$RUNNER_TEMP/haider-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/haider-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r listed_keychain; do
            [ -n "$listed_keychain" ] && ORIGINAL_KEYCHAINS+=("$listed_keychain")
          done < <(security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')

          cleanup_signing_keychain() {
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12"
          }
          trap cleanup_signing_keychain EXIT

          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS[@]}"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "Recovered certificate does not contain a Developer ID Application identity" >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haider \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haider
          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haiderd \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haiderd

          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haiderd
      - name: smoke (binary runs + self-test; strict version match on tag builds)
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          "$BIN" self-test | grep '"ok":true'
          if [ "$RUNNER_OS" != "Windows" ]; then file "$BIN"; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$("$BIN" --version)" = "haider $TAG"
          else
            "$BIN" --version
          fi
      # THE GATE THAT WOULD HAVE CAUGHT THE 0.0.964 WINDOWS P0.
      #
      # `self-test` and `--version` never reach profile resolution, so for the
      # entire life of the project the release gate could not see that
      # ProfileEnv::capture() read only HOME -- which is not a Windows
      # environment variable. Every Windows user got exit 70 before anything
      # happened; on Explorer the console vanished with the message inside it.
      #
      # `--ready` is the scriptable front door: it resolves the profile,
      # connect-or-spawns the daemon, reports, and exits. It is the shallowest
      # command that exercises the real startup path.
      #
      # HAIDER_PROFILE_DIR is deliberately NOT set here. Setting it is exactly
      # what blinded every existing Windows integration test: it short-circuits
      # the resolver under test. HOME is scrubbed for the same reason -- the
      # xplat suite runs under Git Bash, which exports HOME, so a stock-Windows
      # bug survives a green Windows CI run. This asserts what a real user has:
      # USERPROFILE and no HOME.
      - name: front door resolves a profile from a stock environment
        shell: bash
        run: |
          set -euo pipefail
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN="$PWD/target/${{ matrix.target }}/release/haider$EXE"
          OUT="$RUNNER_TEMP/front-door.txt"

          if [ "$RUNNER_OS" = "Windows" ]; then
            # Reproduce Explorer/PowerShell: USERPROFILE present, HOME absent.
            env -u HOME -u HAIDER_PROFILE_DIR "$BIN" --ready > "$OUT" 2>&1 && rc=0 || rc=$?
          else
            env -u HAIDER_PROFILE_DIR "$BIN" --ready > "$OUT" 2>&1 && rc=0 || rc=$?
          fi

          cat "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the front door failed with exit $rc from a stock environment" >&2
            exit 1
          fi
          # Belt and braces: even a zero exit must not carry the resolver error.
          if grep -qi "cannot resolve a profile directory" "$OUT"; then
            echo "::error::profile resolution failed -- this is the 0.0.964 Windows P0 class" >&2
            exit 1
          fi
      - name: notarize macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Apple notarization secret is unavailable: $name" >&2
              exit 1
            fi
          done

          PAYLOAD="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}"
          ARCHIVE="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}.zip"
          RESULT="$RUNNER_TEMP/haider-notarization-result.json"
          mkdir -p "$PAYLOAD"
          cp target/${{ matrix.target }}/release/haider "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haiderd "$PAYLOAD/"
          ditto -c -k --keepParent "$PAYLOAD" "$ARCHIVE"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m --output-format json > "$RESULT"

          jq '{id, status, message}' "$RESULT"
          STATUS="$(jq -r '.status // empty' "$RESULT")"
          SUBMISSION_ID="$(jq -r '.id // empty' "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"
            fi
            echo "Apple notarization failed with status: ${STATUS:-unknown}" >&2
            exit 1
          fi

          # stapler cannot attach tickets to raw Mach-O files or ZIP archives.
          # Apple publishes the nested-binary tickets for Gatekeeper to resolve
          # online; the exact signed bytes are packaged below without mutation.
      - name: archive daemon symbols by native build ID
        shell: bash
        run: |
          set -euo pipefail

          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          RELEASE_DIR=target/${{ matrix.target }}/release
          DBIN="$RELEASE_DIR/haiderd$EXE"
          ARCHIVER="$RELEASE_DIR/haider-symbol-archive$EXE"
          case "$RUNNER_OS" in
            macOS) SYMBOLS="$RELEASE_DIR/haiderd.dSYM" ;;
            Linux) SYMBOLS="$RELEASE_DIR/haiderd.dwp" ;;
            Windows) SYMBOLS="$RELEASE_DIR/haiderd.pdb" ;;
            *) echo "Unsupported symbol platform: $RUNNER_OS" >&2; exit 1 ;;
          esac

          "$ARCHIVER" "$DBIN" "$SYMBOLS" "symbols/${{ matrix.target }}"
          du -sh "symbols/${{ matrix.target }}"
      - name: package
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          DBIN=target/${{ matrix.target }}/release/haiderd$EXE
          WBIN=target/${{ matrix.target }}/release/haider-wayland-portal
          REF="${GITHUB_REF_NAME:-manual}"
          NAME=haider-${REF}-${{ matrix.target }}
          mkdir -p dist/$NAME
          # BOTH binaries: bare `haider` spawns the SIBLING `haiderd` next to
          # current_exe() (haider-client/src/spawn.rs) — a bundle without the
          # daemon cannot enter live mode (v0.0.12 first-cut gap).
          cp "$BIN" "$DBIN" dist/$NAME/
          if [ "$RUNNER_OS" = "Linux" ]; then cp "$WBIN" dist/$NAME/; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # haider.exe is a CONSOLE binary. Double-clicked from Explorer,
            # Windows destroys the console the instant the process exits and
            # takes any error with it -- the reported "blank window for a
            # second, then disappears". Ship a launcher that holds the window
            # open on a non-zero exit, and a README covering the SmartScreen
            # prompt that an unsigned binary necessarily produces.
            # printf, not a heredoc: a heredoc terminator must sit at column 0
            # and would break this YAML block scalar.
            printf '%s\r\n' \
              '@echo off' \
              'cd /d "%~dp0"' \
              'haider.exe %*' \
              'set HAIDER_EXIT=%ERRORLEVEL%' \
              'if not "%HAIDER_EXIT%"=="0" (' \
              '  echo.' \
              '  echo haider exited with code %HAIDER_EXIT%.' \
              '  echo The message above is the reason.' \
              '  echo Report it at https://github.com/Rizzist/haider-agent/issues' \
              '  echo.' \
              '  pause' \
              ')' \
              'exit /b %HAIDER_EXIT%' > "dist/$NAME/haider.cmd"
            printf '%s\r\n' \
              'Haider for Windows' \
              '==================' \
              '' \
              'RUN IT' \
              '  Double-click haider.cmd  (not haider.exe -- see below)' \
              '' \
              '  Or from a terminal, which is better because you keep the output:' \
              '      cd path\to\this\folder' \
              '      haider.exe' \
              '' \
              '  haider.exe is a console program. Double-clicked from Explorer,' \
              '  Windows closes the window the moment it exits, so you never get' \
              '  to read an error. haider.cmd keeps the window open on failure.' \
              '' \
              '"WINDOWS PROTECTED YOUR PC"' \
              '  These binaries are not yet code-signed, so SmartScreen warns and' \
              '  Defender may quarantine them. That warning is about the ABSENCE' \
              '  of a signature, not about detected malicious behaviour.' \
              '  To run anyway: click "More info", then "Run anyway".' \
              '' \
              '  Verify what you downloaded -- the release page publishes a' \
              '  SHA-256 next to the zip:' \
              '      certutil -hashfile <the-zip-you-downloaded> SHA256' \
              '' \
              'KEEP BOTH FILES TOGETHER' \
              '  haider.exe starts haiderd.exe from its own folder. Moving one' \
              '  without the other breaks it. To put haider on PATH, add this' \
              '  whole folder rather than copying haider.exe elsewhere.' \
              '' \
              'Source, releases and issues:' \
              '  https://github.com/Rizzist/haider-agent' > "dist/$NAME/README.txt"
            # Zip is the native Windows archive expectation; Explorer opens it
            # without extra tooling and sha256sum ships with Git Bash.
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          else
            tar -C dist -cJf dist/$NAME.tar.xz $NAME
            (cd dist && shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256")
          fi
      - name: upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: |
            dist/*.tar.*
            dist/*.zip*
          if-no-files-found: error
      # Current arm64 macOS line-table symbols are 191 MiB raw / 43.7 MiB
      # gzip-compressed. Keep this private CI artifact long enough for recent
      # crash triage without paying unbounded storage on every release.
      - name: upload native-ID-keyed daemon symbols (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.target }}
          path: symbols/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push'   # only tag pushes cut a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - name: download Android APK artifact when available
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          RUN_ID=""
          MISSING_ATTEMPTS=0
          RUNNING_ATTEMPTS=0
          while [ "$RUNNING_ATTEMPTS" -lt 120 ]; do
            RUNS="$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/android-apk.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" \
              2>/dev/null || true)"
            RUN_ID="$(jq -r --arg ref "$GITHUB_REF_NAME" '
              [.workflow_runs[]?] as $all
              | ([$all[] | select(.head_branch == $ref)] | if length > 0 then . else $all end)
              | sort_by(.run_number) | last | .id // empty
            ' <<< "$RUNS" 2>/dev/null || true)"
            if [ -n "$RUN_ID" ]; then
              MISSING_ATTEMPTS=0
              RUNNING_ATTEMPTS=$((RUNNING_ATTEMPTS + 1))
              STATUS="$(jq -r --argjson id "$RUN_ID" \
                '.workflow_runs[] | select(.id == $id) | .status' <<< "$RUNS")"
              CONCLUSION="$(jq -r --argjson id "$RUN_ID" \
                '.workflow_runs[] | select(.id == $id) | .conclusion // empty' <<< "$RUNS")"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  APK_STAGE="$RUNNER_TEMP/haider-android-artifact"
                  mkdir -p "$APK_STAGE"
                  if gh run download "$RUN_ID" \
                    --name haider-android-release \
                    --dir "$APK_STAGE"; then
                    VERSION="${GITHUB_REF_NAME#v}"
                    APK_NAME="haider-v${VERSION}-android.apk"
                    if [ -f "$APK_STAGE/$APK_NAME" ] && \
                       [ -f "$APK_STAGE/$APK_NAME.sha256" ] && \
                       (cd "$APK_STAGE" && sha256sum --check "$APK_NAME.sha256"); then
                      if mv "$APK_STAGE/$APK_NAME" "$APK_STAGE/$APK_NAME.sha256" dist/; then
                        echo "Downloaded Android release artifact from workflow run $RUN_ID"
                      else
                        rm -f "dist/$APK_NAME" "dist/$APK_NAME.sha256"
                        echo "::warning::Android artifact could not be moved into the release directory"
                      fi
                    else
                      echo "::warning::Android artifact was incomplete or failed checksum verification"
                    fi
                  else
                    echo "::warning::Android workflow succeeded, but its APK artifact was unavailable"
                  fi
                else
                  echo "::warning::Android APK workflow concluded '$CONCLUSION'; publishing native assets only"
                fi
                exit 0
              fi
            else
              MISSING_ATTEMPTS=$((MISSING_ATTEMPTS + 1))
              if [ "$MISSING_ATTEMPTS" -ge 8 ]; then
                echo "::warning::Android APK workflow run was absent; publishing native assets only"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::warning::Android APK workflow was still running after 30 minutes; publishing native assets only"
      - name: create or update release (prerelease until v0.1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Cross-platform release (macOS aarch64/x86_64, Linux x86_64/arm64, Windows x86_64). macOS binaries are Developer ID signed and Apple-notarized. Verify the sha256. Linux: chmod +x. Windows is currently unsigned; unzip and allow via SmartScreen → More info → Run anyway."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "haider $GITHUB_REF_NAME" \
              --prerelease \
              --notes "$NOTES"
          fi

  npm:
    name: Publish npm
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
          fi

      - name: Check published npm version
        id: package
        if: steps.token.outputs.skip != 'true'
        working-directory: packaging/npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "haider-agent@$VERSION" version --json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::haider-agent@$VERSION is already published; skipping npm publish"
          fi

      - name: Publish
        if: steps.token.outputs.skip != 'true' && steps.package.outputs.skip != 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public

  repin-packages:
    name: Re-pin Homebrew and Scoop manifests
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: haider-package-manifest-repin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: artifacts
          merge-multiple: true

      - name: Re-pin manifests from release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          sha_file() {
            shasum -a 256 "artifacts/$1" | awk '{print $1}'
          }
          export SHA_DARWIN_ARM
          export SHA_DARWIN_X64
          export SHA_LINUX_ARM64
          export SHA_LINUX_X64
          export SHA_WIN_X64
          SHA_DARWIN_ARM=$(sha_file "haider-v${VERSION}-aarch64-apple-darwin.tar.xz")
          SHA_DARWIN_X64=$(sha_file "haider-v${VERSION}-x86_64-apple-darwin.tar.xz")
          SHA_LINUX_ARM64=$(sha_file "haider-v${VERSION}-aarch64-unknown-linux-gnu.tar.xz")
          SHA_LINUX_X64=$(sha_file "haider-v${VERSION}-x86_64-unknown-linux-gnu.tar.xz")
          SHA_WIN_X64=$(sha_file "haider-v${VERSION}-x86_64-pc-windows-msvc.zip")

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          formula_path = pathlib.Path("packaging/homebrew/haider.rb")
          formula = formula_path.read_text()
          formula, count = re.subn(
              r'(?m)^  version "[^"]+"$',
              f'  version "{version}"',
              formula,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update Homebrew version")

          targets = {
              "aarch64-apple-darwin": os.environ["SHA_DARWIN_ARM"],
              "x86_64-apple-darwin": os.environ["SHA_DARWIN_X64"],
              "aarch64-unknown-linux-gnu": os.environ["SHA_LINUX_ARM64"],
              "x86_64-unknown-linux-gnu": os.environ["SHA_LINUX_X64"],
          }
          for target, digest in targets.items():
              pattern = re.compile(
                  rf'(?m)^(?P<indent>\s*)url "[^"]*haider-v[^"]*-{re.escape(target)}\.tar\.xz"\n'
                  rf'(?P=indent)sha256 "[^"]+"'
              )
              url = (
                  "https://github.com/Rizzist/haider-agent/releases/download/"
                  f"v{version}/haider-v{version}-{target}.tar.xz"
              )
              formula, count = pattern.subn(
                  lambda match: (
                      f'{match.group("indent")}url "{url}"\n'
                      f'{match.group("indent")}sha256 "{digest}"'
                  ),
                  formula,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"could not update Homebrew target {target}")
          formula_path.write_text(formula)

          scoop_path = pathlib.Path("packaging/scoop/haider.json")
          scoop = json.loads(scoop_path.read_text())
          target = "x86_64-pc-windows-msvc"
          scoop["version"] = version
          scoop["architecture"]["64bit"].update(
              {
                  "url": (
                      "https://github.com/Rizzist/haider-agent/releases/download/"
                      f"v{version}/haider-v{version}-{target}.zip"
                  ),
                  "hash": os.environ["SHA_WIN_X64"],
                  "extract_dir": f"haider-v{version}-{target}",
              }
          )
          scoop_path.write_text(json.dumps(scoop, indent=2) + "\n")
          PY

      - name: Commit manifests to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packaging/homebrew/haider.rb packaging/scoop/haider.json
          if git diff --cached --quiet; then
            echo "::warning::Homebrew and Scoop manifests are already pinned to $GITHUB_REF_NAME; skipping commit"
            exit 0
          fi
          git commit -m "packaging: re-pin manifests for $GITHUB_REF_NAME"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      # The Homebrew tap (Rizzist/homebrew-tap, installed as
      # `brew install Rizzist/tap/haidercode`) is a SEPARATE repository, so
      # GITHUB_TOKEN cannot reach it. TAP_TOKEN must be a PAT carrying
      # contents:write on that repo. Without it we warn and skip rather than
      # fail the release: the tap simply stays on its previous version, which
      # is a stale tap rather than a broken release.
      - name: Re-pin the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN is not set; skipping the Homebrew tap re-pin. Rizzist/homebrew-tap stays on its previous version."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Rizzist/homebrew-tap.git" /tmp/tap
          # The tap's formula is the in-repo formula with its class renamed to
          # match the filename, which Homebrew requires. Deriving it here keeps
          # a single source of truth: the pins were already written above.
          sed -e 's/^class Haider < Formula/class Haidercode < Formula/' \
            packaging/homebrew/haider.rb > /tmp/tap/Formula/haidercode.rb
          cd /tmp/tap
          if git diff --quiet; then
            echo "::warning::Homebrew tap is already pinned to $TAG; skipping"
            exit 0
          fi
          git add Formula/haidercode.rb
          git commit -m "haidercode: re-pin to $TAG"
          git push origin HEAD:main

  chocolatey:
    name: Publish Chocolatey
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: artifacts
          merge-multiple: true

      - name: Check Chocolatey token
        id: token
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::CHOCO_API_KEY is not set; skipping Chocolatey publish"
          }

      - name: Check published Chocolatey version
        id: package
        if: steps.token.outputs.skip != 'true'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Existing = choco search haider --exact --version $Version --source https://community.chocolatey.org/api/v2/ --limit-output
          if ($LASTEXITCODE -ne 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output '::warning::Could not query Chocolatey for the existing package version; skipping this publish attempt'
            exit 0
          }
          if (@($Existing) -contains "haider|$Version") {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::haider $Version is already published; skipping Chocolatey push"
          }

      # The first-ever Chocolatey version requires manual community moderation.
      - name: Pack and push
        if: steps.token.outputs.skip != 'true' && steps.package.outputs.skip != 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Target = 'x86_64-pc-windows-msvc'
          $Zip = "haider-v$Version-$Target.zip"
          $Url = "https://github.com/Rizzist/haider-agent/releases/download/v$Version/$Zip"
          $Sha = (Get-FileHash -Algorithm SHA256 -Path "artifacts\$Zip").Hash.ToLowerInvariant()
          Copy-Item packaging\chocolatey dist-choco -Recurse

          $NuspecPath = 'dist-choco\haider.nuspec'
          $Nuspec = Get-Content $NuspecPath -Raw
          $Nuspec = $Nuspec -replace '<version>[^<]+</version>', "<version>$Version</version>"
          Set-Content $NuspecPath $Nuspec

          $InstallPath = 'dist-choco\tools\chocolateyinstall.ps1'
          $Install = Get-Content $InstallPath -Raw
          $Install = $Install -replace '(?m)^\$version = ''[^'']+''$', "`$version = '$Version'"
          $Install = $Install -replace '(?m)^\$url64 = ''[^'']+''$', "`$url64 = '$Url'"
          $Install = $Install -replace '(?m)^\$checksum64 = ''[^'']+''$', "`$checksum64 = '$Sha'"
          Set-Content $InstallPath $Install

          $VerificationPath = 'dist-choco\tools\VERIFICATION.txt'
          $Verification = Get-Content $VerificationPath -Raw
          $Verification = $Verification -replace 'releases/tag/v[^\s]+', "releases/tag/v$Version"
          $Verification = $Verification -replace '(?m)^(?:[a-fA-F0-9]{64}|__SHA_WIN_X64__)$', $Sha
          Set-Content $VerificationPath $Verification

          choco pack $NuspecPath --outputdirectory dist-choco
          $PushOutput = choco push "dist-choco\haider.$Version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1
          $PushExit = $LASTEXITCODE
          $PushOutput | Write-Output
          if ($PushExit -ne 0) {
            $PushText = $PushOutput -join "`n"
            if ($PushText -match '(?i)(already exists|conflict|status code 409)') {
              Write-Output "::warning::haider $Version already exists on Chocolatey; treating the push as an idempotent no-op"
              exit 0
            }
            if ($PushText -match '(?i)(403|Forbidden)') {
              Write-Output "::warning::Chocolatey rejected the CHOCO_API_KEY (403 Forbidden). Regenerate the key at https://community.chocolatey.org/account and update the repository secret CHOCO_API_KEY; the release itself is unaffected."
              exit 0
            }
            if ($PushText -match '(?i)(401|Unauthorized)') {
              Write-Output "::warning::Chocolatey rejected the CHOCO_API_KEY (401 Unauthorized). Regenerate the key at https://community.chocolatey.org/account and update the repository secret CHOCO_API_KEY; the release itself is unaffected."
              exit 0
            }
            exit $PushExit
          }
