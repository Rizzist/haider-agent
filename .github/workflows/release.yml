name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual build-only run (no release published)

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: tag matches workspace version (tag builds only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      - name: build
        run: cargo build --release --locked -p haider-cli -p haider-daemond --target ${{ matrix.target }}
      - name: build Wayland portal companion (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p haider-tools --bin haider-wayland-portal --target ${{ matrix.target }}
      - name: Developer ID sign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERT_PASSWORD:-}" ]; then
            echo "Developer ID signing secrets are required for macOS releases" >&2
            exit 1
          fi

          P12="$RUNNER_TEMP/haider-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/haider-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r listed_keychain; do
            listed_keychain="${listed_keychain//\"/}"
            ORIGINAL_KEYCHAINS+=("$listed_keychain")
          done < <(security list-keychains -d user)

          cleanup_signing_keychain() {
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12"
          }
          trap cleanup_signing_keychain EXIT

          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS[@]}"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "Recovered certificate does not contain a Developer ID Application identity" >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haider \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haider
          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haiderd \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haiderd

          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haiderd
      - name: smoke (binary runs + self-test; strict version match on tag builds)
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          "$BIN" self-test | grep '"ok":true'
          if [ "$RUNNER_OS" != "Windows" ]; then file "$BIN"; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$("$BIN" --version)" = "haider $TAG"
          else
            "$BIN" --version
          fi
      - name: notarize macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Apple notarization secret is unavailable: $name" >&2
              exit 1
            fi
          done

          PAYLOAD="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}"
          ARCHIVE="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}.zip"
          RESULT="$RUNNER_TEMP/haider-notarization-result.json"
          mkdir -p "$PAYLOAD"
          cp target/${{ matrix.target }}/release/haider "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haiderd "$PAYLOAD/"
          ditto -c -k --keepParent "$PAYLOAD" "$ARCHIVE"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m --output-format json > "$RESULT"

          jq '{id, status, message}' "$RESULT"
          STATUS="$(jq -r '.status // empty' "$RESULT")"
          SUBMISSION_ID="$(jq -r '.id // empty' "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"
            fi
            echo "Apple notarization failed with status: ${STATUS:-unknown}" >&2
            exit 1
          fi

          # stapler cannot attach tickets to raw Mach-O files or ZIP archives.
          # Apple publishes the nested-binary tickets for Gatekeeper to resolve
          # online; the exact signed bytes are packaged below without mutation.
      - name: package
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          DBIN=target/${{ matrix.target }}/release/haiderd$EXE
          WBIN=target/${{ matrix.target }}/release/haider-wayland-portal
          REF="${GITHUB_REF_NAME:-manual}"
          NAME=haider-${REF}-${{ matrix.target }}
          mkdir -p dist/$NAME
          # BOTH binaries: bare `haider` spawns the SIBLING `haiderd` next to
          # current_exe() (haider-client/src/spawn.rs) — a bundle without the
          # daemon cannot enter live mode (v0.0.12 first-cut gap).
          cp "$BIN" "$DBIN" dist/$NAME/
          if [ "$RUNNER_OS" = "Linux" ]; then cp "$WBIN" dist/$NAME/; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Zip is the native Windows archive expectation; Explorer opens it
            # without extra tooling and sha256sum ships with Git Bash.
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          else
            tar -C dist -cJf dist/$NAME.tar.xz $NAME
            shasum -a 256 dist/$NAME.tar.xz > dist/$NAME.tar.xz.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.*
            dist/*.zip*

  publish:
    needs: build
    if: github.event_name == 'push'   # only tag pushes cut a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create or update release (prerelease until v0.1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Cross-platform release (macOS aarch64/x86_64, Linux x86_64/arm64, Windows x86_64). macOS binaries are Developer ID signed and Apple-notarized. Verify the sha256. Linux: chmod +x. Windows is currently unsigned; unzip and allow via SmartScreen → More info → Run anyway."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "haider $GITHUB_REF_NAME" \
              --prerelease \
              --notes "$NOTES"
          fi
