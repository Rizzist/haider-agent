name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual build-only run (no release published)

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: tag matches workspace version (tag builds only)
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      - name: build
        run: cargo build --release --locked -p haider-cli -p haider-daemond --target ${{ matrix.target }}
      - name: ad-hoc codesign (macOS only — quarantine-friendly unsigned distribution)
        if: runner.os == 'macOS'
        run: |
          codesign --force -s - target/${{ matrix.target }}/release/haider
          codesign --force -s - target/${{ matrix.target }}/release/haiderd
      - name: smoke (binary runs + self-test; strict version match on tag builds)
        run: |
          BIN=target/${{ matrix.target }}/release/haider
          "$BIN" self-test | grep '"ok":true'
          file "$BIN"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$("$BIN" --version)" = "haider $TAG"
          else
            "$BIN" --version
          fi
      - name: package
        run: |
          BIN=target/${{ matrix.target }}/release/haider
          DBIN=target/${{ matrix.target }}/release/haiderd
          REF="${GITHUB_REF_NAME:-manual}"
          NAME=haider-${REF}-${{ matrix.target }}
          mkdir -p dist/$NAME
          # BOTH binaries: bare `haider` spawns the SIBLING `haiderd` next to
          # current_exe() (haider-client/src/spawn.rs) — a bundle without the
          # daemon cannot enter live mode (v0.0.12 first-cut gap).
          cp "$BIN" "$DBIN" dist/$NAME/
          tar -C dist -cJf dist/$NAME.tar.xz $NAME
          shasum -a 256 dist/$NAME.tar.xz > dist/$NAME.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.*

  publish:
    needs: build
    if: github.event_name == 'push'   # only tag pushes cut a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create or update release (prerelease until v0.1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Cross-platform scaffold-train release (macOS aarch64/x86_64, Linux x86_64/arm64). Unsigned binaries — verify the sha256. macOS: allow via System Settings → Privacy & Security → Open Anyway. Linux: chmod +x."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "haider $GITHUB_REF_NAME" \
              --prerelease \
              --notes "$NOTES"
          fi
