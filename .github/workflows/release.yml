name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual build-only run (no release published)

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglib2.0-dev pkg-config
      - name: tag matches workspace version (tag builds only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      - name: build
        run: cargo build --release --locked -p haider-cli -p haider-daemond --target ${{ matrix.target }}
      - name: build Wayland portal companion (Linux only)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p haider-tools --bin haider-wayland-portal --target ${{ matrix.target }}
      - name: Developer ID sign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERT_PASSWORD:-}" ]; then
            echo "Developer ID signing secrets are required for macOS releases" >&2
            exit 1
          fi

          P12="$RUNNER_TEMP/haider-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/haider-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r listed_keychain; do
            [ -n "$listed_keychain" ] && ORIGINAL_KEYCHAINS+=("$listed_keychain")
          done < <(security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')

          cleanup_signing_keychain() {
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$P12"
          }
          trap cleanup_signing_keychain EXIT

          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS[@]}"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "Recovered certificate does not contain a Developer ID Application identity" >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haider \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haider
          codesign --force --options runtime --timestamp \
            --identifier ai.haidercode.haiderd \
            --sign "$IDENTITY" \
            target/${{ matrix.target }}/release/haiderd

          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haider
          codesign --verify --strict --verbose=4 target/${{ matrix.target }}/release/haiderd
      - name: smoke (binary runs + self-test; strict version match on tag builds)
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          "$BIN" self-test | grep '"ok":true'
          if [ "$RUNNER_OS" != "Windows" ]; then file "$BIN"; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$("$BIN" --version)" = "haider $TAG"
          else
            "$BIN" --version
          fi
      - name: notarize macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Apple notarization secret is unavailable: $name" >&2
              exit 1
            fi
          done

          PAYLOAD="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}"
          ARCHIVE="$RUNNER_TEMP/haider-notarization-${{ matrix.target }}.zip"
          RESULT="$RUNNER_TEMP/haider-notarization-result.json"
          mkdir -p "$PAYLOAD"
          cp target/${{ matrix.target }}/release/haider "$PAYLOAD/"
          cp target/${{ matrix.target }}/release/haiderd "$PAYLOAD/"
          ditto -c -k --keepParent "$PAYLOAD" "$ARCHIVE"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m --output-format json > "$RESULT"

          jq '{id, status, message}' "$RESULT"
          STATUS="$(jq -r '.status // empty' "$RESULT")"
          SUBMISSION_ID="$(jq -r '.id // empty' "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID"
            fi
            echo "Apple notarization failed with status: ${STATUS:-unknown}" >&2
            exit 1
          fi

          # stapler cannot attach tickets to raw Mach-O files or ZIP archives.
          # Apple publishes the nested-binary tickets for Gatekeeper to resolve
          # online; the exact signed bytes are packaged below without mutation.
      - name: archive daemon symbols by native build ID
        shell: bash
        run: |
          set -euo pipefail

          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          RELEASE_DIR=target/${{ matrix.target }}/release
          DBIN="$RELEASE_DIR/haiderd$EXE"
          ARCHIVER="$RELEASE_DIR/haider-symbol-archive$EXE"
          case "$RUNNER_OS" in
            macOS) SYMBOLS="$RELEASE_DIR/haiderd.dSYM" ;;
            Linux) SYMBOLS="$RELEASE_DIR/haiderd.dwp" ;;
            Windows) SYMBOLS="$RELEASE_DIR/haiderd.pdb" ;;
            *) echo "Unsupported symbol platform: $RUNNER_OS" >&2; exit 1 ;;
          esac

          "$ARCHIVER" "$DBIN" "$SYMBOLS" "symbols/${{ matrix.target }}"
          du -sh "symbols/${{ matrix.target }}"
      - name: package
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=target/${{ matrix.target }}/release/haider$EXE
          DBIN=target/${{ matrix.target }}/release/haiderd$EXE
          WBIN=target/${{ matrix.target }}/release/haider-wayland-portal
          REF="${GITHUB_REF_NAME:-manual}"
          NAME=haider-${REF}-${{ matrix.target }}
          mkdir -p dist/$NAME
          # BOTH binaries: bare `haider` spawns the SIBLING `haiderd` next to
          # current_exe() (haider-client/src/spawn.rs) — a bundle without the
          # daemon cannot enter live mode (v0.0.12 first-cut gap).
          cp "$BIN" "$DBIN" dist/$NAME/
          if [ "$RUNNER_OS" = "Linux" ]; then cp "$WBIN" dist/$NAME/; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Zip is the native Windows archive expectation; Explorer opens it
            # without extra tooling and sha256sum ships with Git Bash.
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          else
            tar -C dist -cJf dist/$NAME.tar.xz $NAME
            shasum -a 256 dist/$NAME.tar.xz > dist/$NAME.tar.xz.sha256
          fi
      - name: upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: |
            dist/*.tar.*
            dist/*.zip*
          if-no-files-found: error
      # Current arm64 macOS line-table symbols are 191 MiB raw / 43.7 MiB
      # gzip-compressed. Keep this private CI artifact long enough for recent
      # crash triage without paying unbounded storage on every release.
      - name: upload native-ID-keyed daemon symbols (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.target }}
          path: symbols/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push'   # only tag pushes cut a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - name: create or update release (prerelease until v0.1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Cross-platform release (macOS aarch64/x86_64, Linux x86_64/arm64, Windows x86_64). macOS binaries are Developer ID signed and Apple-notarized. Verify the sha256. Linux: chmod +x. Windows is currently unsigned; unzip and allow via SmartScreen → More info → Run anyway."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "haider $GITHUB_REF_NAME" \
              --prerelease \
              --notes "$NOTES"
          fi

  npm:
    name: Publish npm
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set; skipping npm publish"
          fi

      - name: Check published npm version
        id: package
        if: steps.token.outputs.skip != 'true'
        working-directory: packaging/npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "haider-agent@$VERSION" version --json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::haider-agent@$VERSION is already published; skipping npm publish"
          fi

      - name: Publish
        if: steps.token.outputs.skip != 'true' && steps.package.outputs.skip != 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public

  repin-packages:
    name: Re-pin Homebrew and Scoop manifests
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: haider-package-manifest-repin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: artifacts
          merge-multiple: true

      - name: Re-pin manifests from release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          sha_file() {
            shasum -a 256 "artifacts/$1" | awk '{print $1}'
          }
          export SHA_DARWIN_ARM
          export SHA_DARWIN_X64
          export SHA_LINUX_ARM64
          export SHA_LINUX_X64
          export SHA_WIN_X64
          SHA_DARWIN_ARM=$(sha_file "haider-v${VERSION}-aarch64-apple-darwin.tar.xz")
          SHA_DARWIN_X64=$(sha_file "haider-v${VERSION}-x86_64-apple-darwin.tar.xz")
          SHA_LINUX_ARM64=$(sha_file "haider-v${VERSION}-aarch64-unknown-linux-gnu.tar.xz")
          SHA_LINUX_X64=$(sha_file "haider-v${VERSION}-x86_64-unknown-linux-gnu.tar.xz")
          SHA_WIN_X64=$(sha_file "haider-v${VERSION}-x86_64-pc-windows-msvc.zip")

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          formula_path = pathlib.Path("packaging/homebrew/haider.rb")
          formula = formula_path.read_text()
          formula, count = re.subn(
              r'(?m)^  version "[^"]+"$',
              f'  version "{version}"',
              formula,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update Homebrew version")

          targets = {
              "aarch64-apple-darwin": os.environ["SHA_DARWIN_ARM"],
              "x86_64-apple-darwin": os.environ["SHA_DARWIN_X64"],
              "aarch64-unknown-linux-gnu": os.environ["SHA_LINUX_ARM64"],
              "x86_64-unknown-linux-gnu": os.environ["SHA_LINUX_X64"],
          }
          for target, digest in targets.items():
              pattern = re.compile(
                  rf'(?m)^(?P<indent>\s*)url "[^"]*haider-v[^"]*-{re.escape(target)}\.tar\.xz"\n'
                  rf'(?P=indent)sha256 "[^"]+"'
              )
              url = (
                  "https://github.com/Rizzist/haider-agent/releases/download/"
                  f"v{version}/haider-v{version}-{target}.tar.xz"
              )
              formula, count = pattern.subn(
                  lambda match: (
                      f'{match.group("indent")}url "{url}"\n'
                      f'{match.group("indent")}sha256 "{digest}"'
                  ),
                  formula,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"could not update Homebrew target {target}")
          formula_path.write_text(formula)

          scoop_path = pathlib.Path("packaging/scoop/haider.json")
          scoop = json.loads(scoop_path.read_text())
          target = "x86_64-pc-windows-msvc"
          scoop["version"] = version
          scoop["architecture"]["64bit"].update(
              {
                  "url": (
                      "https://github.com/Rizzist/haider-agent/releases/download/"
                      f"v{version}/haider-v{version}-{target}.zip"
                  ),
                  "hash": os.environ["SHA_WIN_X64"],
                  "extract_dir": f"haider-v{version}-{target}",
              }
          )
          scoop_path.write_text(json.dumps(scoop, indent=2) + "\n")
          PY

      - name: Commit manifests to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packaging/homebrew/haider.rb packaging/scoop/haider.json
          if git diff --cached --quiet; then
            echo "::warning::Homebrew and Scoop manifests are already pinned to $GITHUB_REF_NAME; skipping commit"
            exit 0
          fi
          git commit -m "packaging: re-pin manifests for $GITHUB_REF_NAME"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

  chocolatey:
    name: Publish Chocolatey
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: artifacts
          merge-multiple: true

      - name: Check Chocolatey token
        id: token
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::CHOCO_API_KEY is not set; skipping Chocolatey publish"
          }

      - name: Check published Chocolatey version
        id: package
        if: steps.token.outputs.skip != 'true'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Existing = choco search haider --exact --version $Version --source https://community.chocolatey.org/api/v2/ --limit-output
          if ($LASTEXITCODE -ne 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output '::warning::Could not query Chocolatey for the existing package version; skipping this publish attempt'
            exit 0
          }
          if (@($Existing) -contains "haider|$Version") {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::haider $Version is already published; skipping Chocolatey push"
          }

      # The first-ever Chocolatey version requires manual community moderation.
      - name: Pack and push
        if: steps.token.outputs.skip != 'true' && steps.package.outputs.skip != 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Target = 'x86_64-pc-windows-msvc'
          $Zip = "haider-v$Version-$Target.zip"
          $Url = "https://github.com/Rizzist/haider-agent/releases/download/v$Version/$Zip"
          $Sha = (Get-FileHash -Algorithm SHA256 -Path "artifacts\$Zip").Hash.ToLowerInvariant()
          Copy-Item packaging\chocolatey dist-choco -Recurse

          $NuspecPath = 'dist-choco\haider.nuspec'
          $Nuspec = Get-Content $NuspecPath -Raw
          $Nuspec = $Nuspec -replace '<version>[^<]+</version>', "<version>$Version</version>"
          Set-Content $NuspecPath $Nuspec

          $InstallPath = 'dist-choco\tools\chocolateyinstall.ps1'
          $Install = Get-Content $InstallPath -Raw
          $Install = $Install -replace '(?m)^\$version = ''[^'']+''$', "`$version = '$Version'"
          $Install = $Install -replace '(?m)^\$url64 = ''[^'']+''$', "`$url64 = '$Url'"
          $Install = $Install -replace '(?m)^\$checksum64 = ''[^'']+''$', "`$checksum64 = '$Sha'"
          Set-Content $InstallPath $Install

          $VerificationPath = 'dist-choco\tools\VERIFICATION.txt'
          $Verification = Get-Content $VerificationPath -Raw
          $Verification = $Verification -replace 'releases/tag/v[^\s]+', "releases/tag/v$Version"
          $Verification = $Verification -replace '(?m)^(?:[a-fA-F0-9]{64}|__SHA_WIN_X64__)$', $Sha
          Set-Content $VerificationPath $Verification

          choco pack $NuspecPath --outputdirectory dist-choco
          $PushOutput = choco push "dist-choco\haider.$Version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1
          $PushExit = $LASTEXITCODE
          $PushOutput | Write-Output
          if ($PushExit -ne 0) {
            $PushText = $PushOutput -join "`n"
            if ($PushText -match '(?i)(already exists|conflict|status code 409)') {
              Write-Output "::warning::haider $Version already exists on Chocolatey; treating the push as an idempotent no-op"
              exit 0
            }
            exit $PushExit
          }
