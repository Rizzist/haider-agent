name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: tag matches workspace version (pre-build check)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml || { echo "tag v$TAG != workspace version"; exit 1; }
      - name: build
        run: cargo build --release --locked -p haider-cli --target ${{ matrix.target }}
      - name: smoke (artifact must match tag + pass self-test)
        run: |
          BIN=target/${{ matrix.target }}/release/haider
          TAG="${GITHUB_REF_NAME#v}"
          test "$($BIN --version)" = "haider $TAG"
          $BIN self-test | grep '"ok":true'
          file "$BIN"
      - name: package
        run: |
          BIN=target/${{ matrix.target }}/release/haider
          NAME=haider-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$NAME
          cp "$BIN" dist/$NAME/
          tar -C dist -cJf dist/$NAME.tar.xz $NAME
          shasum -a 256 dist/$NAME.tar.xz > dist/$NAME.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.*

  publish:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release (prerelease until v0.1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "haider $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Scaffold-train release. Unsigned macOS binaries — verify the sha256, then allow via System Settings → Privacy & Security → Open Anyway."
