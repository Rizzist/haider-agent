[package]
name = "haider-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["desktop-clipboard"]
desktop-clipboard = ["dep:arboard"]

[[test]]
name = "w970_winclip_windows_tests"
required-features = ["desktop-clipboard"]

[dependencies]
haider-platform = { path = "../haider-platform" }
haider-protocol = { path = "../haider-protocol" }
haider-rpc = { path = "../haider-rpc" }
haider-client = { path = "../haider-client" }
haider-stt = { path = "../haider-stt" }
zeroize.workspace = true
base64.workspace = true
ratatui.workspace = true
serde.workspace = true
termbg.workspace = true
tokio.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Android Phase 1 builds the CLI/TUI too, but arboard has no Android backend.
# Keep the desktop feature enabled by default without resolving arboard there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { workspace = true, optional = true }

[dev-dependencies]
haider-provider = { path = "../haider-provider" }
zeroize.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
