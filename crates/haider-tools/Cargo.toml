[package]
name = "haider-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "haider-wayland-portal"
path = "src/bin/haider-wayland-portal.rs"
test = false
bench = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
globset.workspace = true
haider-protocol = { path = "../haider-protocol" }
haider-platform = { path = "../haider-platform" }
ignore.workspace = true
regex.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["mm"] }

[dev-dependencies]
# Compile the Linux backend (including Wayland selection) in host unit-test
# builds even when the Linux standard library target is unavailable locally.
x11rb.workspace = true

[lints]
workspace = true
