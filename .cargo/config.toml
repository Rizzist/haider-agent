# Standalone packaging uses cargo-ndk 4.1.2 + NDK r28c + `-P 26`.
# cargo-ndk's CARGO_TARGET_*_LINKER environment values override these legacy
# compile-only fallbacks. xplat.yml still prepends its NDK LLVM bin directory;
# retaining API-26 fallbacks avoids breaking that independently owned job.
[target.aarch64-linux-android]
linker = "aarch64-linux-android26-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi26-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android26-clang"

[target.i686-linux-android]
linker = "i686-linux-android26-clang"
